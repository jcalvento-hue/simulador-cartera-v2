            ))}
          </div>

          {/* Modal reporte noticia */}
          {reporteNoticia && (
            <div className="modal-overlay" onClick={() => setReporteNoticia(null)}>
              <div className="modal" style={{ maxWidth: 640, maxHeight: "80vh", overflow: "auto" }} onClick={e => e.stopPropagation()}>
                <div className="modal-title">📰 {reporteNoticia.noticia.titulo}</div>
                <p style={{ fontSize: 13, color: "var(--gris)" }}>Grupos que leyeron: <b>{reporteNoticia.grupos_que_leyeron}</b></p>
                <h4 style={{ marginTop: 16, marginBottom: 8, fontSize: 13 }}>Operaciones realizadas tras esta noticia</h4>
                {reporteNoticia.operaciones_post_noticia.length === 0 ? (
                  <p style={{ color: "var(--gris)", fontSize: 13 }}>Ninguna operación vinculada a esta noticia.</p>
                ) : (
                  <table>
                    <thead><tr><th>Grupo</th><th>Ticker</th><th>Tipo</th><th>Cantidad</th><th>Fecha</th></tr></thead>
                    <tbody>
                      {reporteNoticia.operaciones_post_noticia.map((o, i) => (
                        <tr key={i}>
                          <td>{o.grupo}</td>
                          <td><b>{o.instrumento}</b></td>
                          <td className={o.tipo === "compra" ? "pos" : "neg"}>{o.tipo}</td>
                          <td>{o.cantidad}</td>
                          <td style={{ fontSize: 11 }}>{fmtFecha(o.timestamp)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
                <div className="modal-actions">
                  <button className="btn btn-outline" onClick={() => setReporteNoticia(null)}>Cerrar</button>
                </div>
              </div>
            </div>
          )}
        </>
      )}

      {tab === "ranking" && (
        <div className="panel-section">
          <div className="panel-section-title">Ranking general</div>
          {ranking.map(g => (
            <div key={g.grupo} className="ranking-row">
              <div className={`ranking-pos ${g.posicion === 1 ? "gold" : g.posicion === 2 ? "silver" : g.posicion === 3 ? "bronze" : ""}`}>
                {g.posicion === 1 ? "🥇" : g.posicion === 2 ? "🥈" : g.posicion === 3 ? "🥉" : g.posicion}
              </div>
              <div className="ranking-nombre">
                {g.grupo}
                {g.perfil_riesgo && <span className={`badge badge-${g.perfil_riesgo}`} style={{ marginLeft: 8 }}>{g.perfil_riesgo}</span>}
              </div>
              <div>
                <div style={{ fontSize: 12, color: "var(--gris)" }}>{fmt(g.capital_total)} · {g.num_operaciones} ops.</div>
              </div>
              <div className={`ranking-rend ${g.rendimiento_pct >= 0 ? "pos" : "neg"}`}>{fmtPct(g.rendimiento_pct)}</div>
            </div>
          ))}
        </div>
      )}

      {tab === "bitacoras" && (
        <div className="panel-section">
          <div className="panel-section-title" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
            <span>📓 Bitácora de decisiones</span>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <select
                value={filtroBitacoraGrupo}
                onChange={e => {
                  setFiltroBitacoraGrupo(e.target.value);
                  setLoadingBitacoras(true);
                  const params = e.target.value ? `?grupo_id=${e.target.value}` : "";
                  api("GET", `/api/docente/reportes/bitacoras${params}`, null, token)
                    .then(data => setBitacoras(data))
                    .catch(() => {})
                    .finally(() => setLoadingBitacoras(false));
                }}
                style={{ fontSize: 13, padding: "4px 8px", borderRadius: 6, border: "1px solid var(--borde, #d1d5db)" }}
              >
                <option value="">Todos los grupos</option>
                {grupos.map(g => <option key={g.id} value={g.id}>{g.nombre}</option>)}
              </select>
              <button className="btn btn-outline btn-sm" onClick={() => {
                setLoadingBitacoras(true);
                const params = filtroBitacoraGrupo ? `?grupo_id=${filtroBitacoraGrupo}` : "";
                api("GET", `/api/docente/reportes/bitacoras${params}`, null, token)
                  .then(data => setBitacoras(data))
                  .catch(() => {})
                  .finally(() => setLoadingBitacoras(false));
              }}>🔄 Recargar</button>
            </div>
          </div>
          {loadingBitacoras ? (
            <p style={{ color: "var(--gris)", fontSize: 13 }}>Cargando bitácoras...</p>
          ) : bitacoras.length === 0 ? (
            <p style={{ color: "var(--gris)", fontSize: 13 }}>Todavía no hay operaciones con justificación registradas.</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 8 }}>
              {bitacoras.map(b => (
                <div key={b.id} style={{
                  border: "1px solid var(--borde, #e5e7eb)",
                  borderRadius: 8,
                  padding: "12px 16px",
                  background: "var(--blanco)",
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 700, fontSize: 14 }}>{b.grupo}</span>
                    <span className="badge" style={{ background: b.tipo === "compra" ? "#dcfce7" : "#fee2e2", color: b.tipo === "compra" ? "#166534" : "#991b1b", textTransform: "capitalize" }}>{b.tipo}</span>
                    <span style={{ fontWeight: 600 }}>{b.instrumento}</span>
                    <span style={{ color: "var(--gris)", fontSize: 12 }}>× {b.cantidad} @ {fmt(b.precio)}</span>
                    <span style={{ marginLeft: "auto", fontSize: 12, color: "var(--gris)", whiteSpace: "nowrap" }}>{new Date(b.timestamp).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span>
                  </div>
                  <div style={{ fontSize: 13, color: "#374151", background: "#f9fafb", borderRadius: 6, padding: "8px 12px", lineHeight: 1.5 }}>
                    "{b.justificacion}"
                  </div>
                  {b.advertencia_perfil && (
                    <div style={{ fontSize: 11, color: "#d97706", marginTop: 6 }}>⚠️ Operación fuera del perfil de riesgo asignado</div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {tab === "config" && (
        <div style={{ maxWidth: 520 }}>
          {/* Activar / desactivar simulador */}
          <div className="panel-section">
            <div className="panel-section-title">Estado del simulador</div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 0" }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 15 }}>
                  {config.activo ? "🟢 Activo" : "⚫ Inactivo"}
                </div>
                <div style={{ fontSize: 12, color: "var(--gris)", marginTop: 3 }}>
                  {config.activo
                    ? "Los grupos pueden operar. Precios actualizándose cada 30s."
                    : "Los grupos no pueden acceder al simulador."}
                </div>
              </div>
              <button
                className={`btn ${config.activo ? "btn-outline" : "btn-primary"}`}
                style={{ minWidth: 130 }}
                disabled={savingConfig}
                onClick={() => guardarConfig({ activo: !config.activo })}
              >
                {savingConfig ? "Guardando..." : config.activo ? "⏸ Desactivar" : "▶ Activar simulador"}
              </button>
            </div>
            {!config.activo && (
              <div style={{ fontSize: 12, color: "var(--naranja)", background: "#fef3c7", borderRadius: 6, padding: "8px 12px" }}>
                ⚠️ Al activar se generará automáticamente el historial de precios de las últimas 2 horas para todos los activos.
              </div>
            )}
            {config.activo && (
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid var(--borde, #e5e7eb)" }}>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Regenerar historial</div>
                <div style={{ fontSize: 12, color: "var(--gris)", marginBottom: 10 }}>
                  Reinicia la variación de sesión de todos los activos. Útil al comenzar una nueva clase con el simulador ya activo.
                </div>
                <button
                  className="btn btn-outline"
                  disabled={savingConfig}
                  onClick={regenerarHistorial}
                >
                  {savingConfig ? "Regenerando..." : "🔄 Regenerar historial"}
                </button>
              </div>
            )}
          </div>

          {/* Parámetros */}
          <div className="panel-section">
            <div className="panel-section-title">Parámetros de la experiencia</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, fontSize: 13 }}>
                <span style={{ fontWeight: 600 }}>Nombre de la experiencia</span>
                <input
                  value={config.nombre_experiencia || ""}
                  onChange={e => setConfig(c => ({ ...c, nombre_experiencia: e.target.value }))}
                  placeholder="Ej: Simulador 2C 2024"
                />
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, fontSize: 13 }}>
                <span style={{ fontWeight: 600 }}>Capital inicial por grupo ($)</span>
                <input
                  type="number"
                  value={config.capital_inicial}
                  onChange={e => setConfig(c => ({ ...c, capital_inicial: parseFloat(e.target.value) || 0 }))}
                  min={0}
                  step={100000}
                />
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, fontSize: 13 }}>
                <span style={{ fontWeight: 600 }}>Comisión por operación (%)</span>
                <input
                  type="number"
                  value={((config.comision || 0) * 100).toFixed(2)}
                  onChange={e => setConfig(c => ({ ...c, comision: parseFloat(e.target.value) / 100 || 0 }))}
                  min={0}
                  max={5}
                  step={0.01}
                />
                <span style={{ fontSize: 11, color: "var(--gris)" }}>
                  Actualmente: {((config.comision || 0) * 100).toFixed(2)}% → sobre ${fmt(config.capital_inicial)} = {fmt(config.capital_inicial * (config.comision || 0))} por operación de capital completo
                </span>
              </label>
              <button
                className="btn btn-primary"
                style={{ alignSelf: "flex-start", marginTop: 4 }}
                disabled={savingConfig}
                onClick={() => guardarConfig({
                  nombre_experiencia: config.nombre_experiencia,
                  capital_inicial: config.capital_inicial,
                  comision: config.comision,
                })}
              >
                {savingConfig ? "Guardando..." : "💾 Guardar parámetros"}
              </button>
            </div>
          </div>

          {/* Instrumentos */}
          <div className="panel-section" style={{ maxWidth: "100%" }}>
            <div className="panel-section-title">Instrumentos disponibles</div>
            <p style={{ fontSize: 12, color: "var(--gris)", marginBottom: 12 }}>
              Configurá el sector y la tendencia esperada de cada instrumento para la duración de la simulación.
            </p>
            {loadingInstr ? (
              <p style={{ fontSize: 13, color: "var(--gris)" }}>Cargando instrumentos...</p>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>Ticker</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Sector</th>
                    <th>Tendencia esperada</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {instrumentos.map(instr => {
                    const editing = editandoInstr[instr.id] !== undefined;
                    const vals = editing ? editandoInstr[instr.id] : { sector: instr.sector || "", tendencia_esperada: instr.tendencia_esperada || "neutro" };
                    const TEND_COLOR = { alcista: "var(--verde)", bajista: "var(--rojo)", neutro: "var(--gris)" };
                    return (
                      <tr key={instr.id}>
                        <td><b>{instr.ticker}</b></td>
                        <td style={{ fontSize: 12, color: "var(--gris)" }}>{instr.nombre}</td>
                        <td><span className="badge" style={{ background: "#f3f4f6", color: "#374151" }}>{instr.tipo}</span></td>
                        <td>
                          {editing ? (
                            <input
                              value={vals.sector}
                              onChange={e => setEditandoInstr(prev => ({ ...prev, [instr.id]: { ...prev[instr.id], sector: e.target.value } }))}
                              style={{ width: 140, fontSize: 13, padding: "3px 8px" }}
                            />
                          ) : (
                            <span style={{ fontSize: 13 }}>{instr.sector || <span style={{ color: "#d1d5db" }}>—</span>}</span>
                          )}
                        </td>
                        <td>
                          {editing ? (
                            <select
                              value={vals.tendencia_esperada}
                              onChange={e => setEditandoInstr(prev => ({ ...prev, [instr.id]: { ...prev[instr.id], tendencia_esperada: e.target.value } }))}
                              style={{ fontSize: 13, padding: "3px 8px", borderRadius: 6, border: "1px solid var(--borde)", background: "var(--fondo)", color: "var(--texto)" }}
                            >
                              <option value="alcista">📈 Alcista</option>
                              <option value="bajista">📉 Bajista</option>
                              <option value="neutro">➡️ Neutro</option>
                            </select>
                          ) : (
                            <span style={{ fontWeight: 600, fontSize: 13, color: TEND_COLOR[instr.tendencia_esperada] || "var(--gris)" }}>
                              {instr.tendencia_esperada === "alcista" ? "📈 Alcista" : instr.tendencia_esperada === "bajista" ? "📉 Bajista" : "➡️ Neutro"}
                            </span>
                          )}
                        </td>
                        <td>
                          {editing ? (
                            <div style={{ display: "flex", gap: 4 }}>
                              <button className="btn btn-sm btn-primary" disabled={savingInstr === instr.id}
                                onClick={() => guardarTendenciaInstr(instr.id)}>
                                {savingInstr === instr.id ? "..." : "💾"}
                              </button>
                              <button className="btn btn-sm btn-outline"
                                onClick={() => setEditandoInstr(prev => { const n = { ...prev }; delete n[instr.id]; return n; })}>✕</button>
                            </div>
                          ) : (
                            <button className="btn btn-sm btn-outline"
                              onClick={() => setEditandoInstr(prev => ({ ...prev, [instr.id]: { sector: instr.sector || "", tendencia_esperada: instr.tendencia_esperada || "neutro" } }))}>
                              ✏️ Editar
                            </button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── BANNER PERFIL PENDIENTE (legacy — no longer used as main flow) ──────────
function EncuestaPendiente({ onIrEncuesta }) {
  return (
    <div className="encuesta-bloqueada">
      <div className="encuesta-bloqueada-card">
        <div className="encuesta-bloqueada-icon">🔒</div>
        <div className="encuesta-bloqueada-titulo">Completá la encuesta de perfil primero</div>
        <p className="encuesta-bloqueada-desc">
          Para operar en el simulador necesitás determinar el perfil inversor de tu grupo.
          Solo lleva un par de minutos.
        </p>
        <button className="btn btn-primary" onClick={onIrEncuesta}>
          Ir a la encuesta →
        </button>
      </div>
    </div>
  );
}

// ── APP PRINCIPAL ──────────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(null);
  const [tab, setTab] = useState("cartera");
  const [toast, setToast] = useState(null);
  const [noLeidasCount, setNoLeidasCount] = useState(0);

  function handleLogin(data) {
    setSession(data);
    if (data.role === "docente") setTab("panel");
    else if (!data.encuesta_completada) setTab("perfil_pendiente");
    else setTab("cartera");
  }

  // Cargar conteo de noticias no leídas al iniciar sesión (sólo alumnos)
  useEffect(() => {
    if (!session || session.role === "docente" || !session.encuesta_completada) return; // encuesta_completada = perfil asignado por docente
    api("GET", "/api/grupos/noticias", null, session.access_token)
      .then(ns => setNoLeidasCount(ns.filter(n => !n.leida).length))
      .catch(() => {});
    const id = setInterval(() => {
      api("GET", "/api/grupos/noticias", null, session.access_token)
        .then(ns => setNoLeidasCount(ns.filter(n => !n.leida).length))
        .catch(() => {});
    }, 30000);
    return () => clearInterval(id);
  }, [session]);

  function logout() {
    setSession(null);
    setTab("cartera");
    setNoLeidasCount(0);
  }

  function perfilAsignado(perfil) {
    setSession(s => ({ ...s, perfil_riesgo: perfil, encuesta_completada: true }));
    setTab("cartera");
  }

  function cambiarTab(id) {
    if (!session.encuesta_completada && id !== "perfil_pendiente") {
      setTab(id); // si no hay perfil, igual navegamos — PerfilAsignadoPage se muestra inline
      setToast("⚠️ El docente aún no asignó un perfil a tu grupo");
      setTimeout(() => setToast(null), 2800);
    } else {
      setTab(id);
    }
  }

  if (!session) return <LoginPage onLogin={handleLogin} />;

  const esDocente = session.role === "docente";
  const perfil = session.perfil_riesgo;

  const tabsGrupo = [
    { id: "cartera", label: "Mi Cartera" },
    { id: "operar", label: "Operar" },
    { id: "noticias", label: "Noticias", badge: noLeidasCount > 0 ? noLeidasCount : null },
    { id: "ranking", label: "Ranking" },
    { id: "historial", label: "Historial" },
  ];

  return (
    <>
      <nav className="nav">
        <div className="nav-brand">
          {/* logo nav */}<img id="nav-logo-img" className="nav-logo" alt="FCE UNICEN" ref={el => { if(el) el.src = LOGO_FCE; }} />
          Económicas UNICEN
        </div>
        <div className="nav-right">
          {!esDocente && (
            <div className="nav-tabs">
              {tabsGrupo.map(t => (
                <button key={t.id} className={`tab-btn ${tab === t.id ? "active" : ""}`}
                  onClick={() => cambiarTab(t.id)}
                  style={{ position: "relative" }}>
                  {t.label}
                  {t.badge && (
                    <span style={{
                      position: "absolute", top: -4, right: -6,
                      background: "#ef4444", color: "#fff",
                      borderRadius: "50%", minWidth: 16, height: 16,
                      fontSize: 10, fontWeight: 700, lineHeight: "16px",
                      textAlign: "center", padding: "0 3px",
                      boxShadow: "0 0 0 2px var(--azul)",
                    }}>{t.badge}</span>
                  )}
                </button>
              ))}
            </div>
          )}
          <span style={{ fontSize: 12, opacity: .8 }}>
            {esDocente ? "👤 Docente" : session.nombre}
            {perfil && <span className={`badge badge-${perfil}`} style={{ marginLeft: 8 }}>{perfil}</span>}
          </span>
          <button className="btn-logout" onClick={logout}>Salir</button>
        </div>
      </nav>

      {toast && <div className="toast">{toast}</div>}

      {esDocente && <PanelDocente token={session.access_token} />}
      {!esDocente && !session.encuesta_completada && (
        <PerfilAsignadoPage token={session.access_token} onReady={perfilAsignado} />
      )}
      {!esDocente && tab === "cartera" && session.encuesta_completada && (
        <MiCartera token={session.access_token} perfil={perfil} />
      )}
      {!esDocente && tab === "operar" && session.encuesta_completada && (
        <Operar token={session.access_token} perfil={perfil} />
      )}
      {!esDocente && tab === "noticias" && session.encuesta_completada && (
        <Noticias token={session.access_token} onNoLeidasChange={setNoLeidasCount} />
      )}
      {!esDocente && tab === "ranking" && session.encuesta_completada && (
        <Ranking token={session.access_token} />
      )}
      {!esDocente && tab === "historial" && session.encuesta_completada && (
        <Historial token={session.access_token} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
