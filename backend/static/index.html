<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Cartera — Económicas UNICEN</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* ── Tokens de diseño ─────────────────────────────────────────── */
    :root {
      --azul:    #1452EF;
      --fondo:   #E7EAF1;
      --texto:   #282828;
      --blanco:  #ffffff;
      --gris:    #6b7280;
      --verde:   #16a34a;
      --rojo:    #dc2626;
      --naranja: #d97706;
      --sombra:  0 1px 3px rgba(0,0,0,.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Gantari', Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
    }
    /* Nav */
    .nav {
      background: var(--azul);
      color: var(--blanco);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .nav-brand { font-size: 16px; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
    .nav-logo { height: 32px; width: auto; display: block; border-radius: 6px; background: white; padding: 2px; }
    .nav-right { display: flex; align-items: center; gap: 16px; font-size: 13px; }
    .nav-tabs { display: flex; gap: 4px; }
    .tab-btn {
      background: transparent;
      color: rgba(255,255,255,.75);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }
    .tab-btn:hover { background: rgba(255,255,255,.12); color: var(--blanco); }
    .tab-btn.active { background: rgba(255,255,255,.22); color: var(--blanco); font-weight: 700; }
    .btn-logout {
      background: rgba(255,255,255,.15);
      color: var(--blanco);
      border: 1px solid rgba(255,255,255,.3);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    /* Layout */
    .page { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    /* Cards */
    .card {
      background: var(--blanco);
      border-radius: 12px;
      box-shadow: var(--sombra);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--azul); }
    /* KPI row */
    .kpi-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .kpi {
      background: var(--blanco);
      border-radius: 10px;
      padding: 14px 18px;
      flex: 1 1 160px;
      box-shadow: var(--sombra);
    }
    .kpi-label { font-size: 11px; color: var(--gris); text-transform: uppercase; margin-bottom: 4px; }
    .kpi-value { font-size: 20px; font-weight: 700; }
    .kpi-value.pos { color: var(--verde); }
    .kpi-value.neg { color: var(--rojo); }
    /* Tablas */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; color: var(--gris); border-bottom: 2px solid var(--fondo); }
    td { padding: 10px 10px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #f8f9ff; }
    .pos { color: var(--verde); font-weight: 600; }
    .neg { color: var(--rojo); font-weight: 600; }
    /* Botones */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--azul); color: var(--blanco); }
    .btn-success { background: var(--verde); color: var(--blanco); }
    .btn-danger  { background: var(--rojo);  color: var(--blanco); }
    .btn-outline { background: transparent; color: var(--azul); border: 1.5px solid var(--azul); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    /* Formularios */
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--azul); }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--gris); text-transform: uppercase; }
    /* Alertas */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .alert-warning { background: #fffbeb; border: 1.5px solid #fbbf24; color: #92400e; }
    .alert-error   { background: #fef2f2; border: 1.5px solid #fca5a5; color: #7f1d1d; }
    .alert-success { background: #f0fdf4; border: 1.5px solid #86efac; color: #14532d; }
    .alert-info    { background: #eff6ff; border: 1.5px solid #93c5fd; color: #1e3a8a; }
    /* Badge perfil */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-conservador { background: #dbeafe; color: #1e40af; }
    .badge-moderado    { background: #fef3c7; color: #92400e; }
    .badge-agresivo    { background: #fee2e2; color: #991b1b; }
    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--blanco);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .login-sub { color: var(--gris); font-size: 13px; margin-bottom: 28px; }
    /* Encuesta */
    .encuesta-header {
      background: var(--blanco);
      border-radius: 14px;
      padding: 22px 24px 18px;
      box-shadow: var(--sombra);
      margin-bottom: 20px;
    }
    .encuesta-header h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .encuesta-header p { color: var(--gris); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .progreso-barra {
      background: #e5e7eb;
      border-radius: 8px;
      height: 7px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progreso-fill {
      background: var(--azul);
      height: 100%;
      border-radius: 8px;
      transition: width .35s ease;
    }
    .progreso-label { font-size: 11px; color: var(--gris); }
    .pregunta-card {
      background: var(--blanco);
      border-radius: 14px;
      padding: 22px 22px 16px;
      box-shadow: var(--sombra);
      margin-bottom: 14px;
    }
    .pregunta-num {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--azul);
      background: #eff6ff;
      border-radius: 20px;
      padding: 2px 10px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .pregunta-texto { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
    .opcion {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      gap: 12px;
      padding: 11px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s, box-shadow .15s;
      user-select: none;
    }
    .opcion:hover { border-color: var(--azul); background: #f5f8ff; }
    .opcion.selected {
      border-color: var(--azul);
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(20,82,239,.08);
    }
    .opcion input[type=radio] { display: none; }
    .opcion-radio {
      flex-shrink: 0;
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .opcion.selected .opcion-radio {
      border-color: var(--azul);
      background: var(--azul);
    }
    .opcion-radio-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      transition: opacity .15s;
    }
    .opcion.selected .opcion-radio-dot { opacity: 1; }
    .opcion-texto { font-size: 14px; line-height: 1.4; flex: 1; }
    /* Noticia */
    .noticia-card {
      border-left: 4px solid var(--azul);
      padding: 14px 16px;
      background: var(--blanco);
      border-radius: 0 10px 10px 0;
      margin-bottom: 12px;
      box-shadow: var(--sombra);
    }
    .noticia-card.fundamental { border-color: var(--azul); }
    .noticia-card.tecnico { border-color: var(--naranja); }
    .noticia-tipo { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .noticia-titulo { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .noticia-contenido { font-size: 13px; color: var(--gris); line-height: 1.5; }
    .noticia-meta { font-size: 11px; color: #9ca3af; margin-top: 8px; }
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .modal {
      background: var(--blanco);
      border-radius: 14px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,.2);
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    /* Encuesta bloqueada */
    .encuesta-bloqueada {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .encuesta-bloqueada-card {
      background: var(--blanco);
      border-radius: 16px;
      box-shadow: var(--sombra);
      padding: 48px 32px;
      text-align: center;
    }
    .encuesta-bloqueada-icon { font-size: 48px; margin-bottom: 16px; }
    .encuesta-bloqueada-titulo { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .encuesta-bloqueada-desc { color: var(--gris); font-size: 14px; line-height: 1.6; max-width: 360px; margin: 0 auto 24px; }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: #1e293b;
      color: white;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      z-index: 9999;
      white-space: nowrap;
      animation: toastIn .2s ease, toastOut .3s ease 2.5s forwards;
    }
    @keyframes toastIn  { from { opacity:0; transform: translateX(-50%) translateY(12px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateX(-50%) translateY(8px); } }
    /* Spinner */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Ranking */
    .ranking-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .ranking-pos { font-size: 20px; font-weight: 800; width: 32px; text-align: center; color: var(--azul); }
    .ranking-pos.gold { color: #d97706; }
    .ranking-pos.silver { color: #6b7280; }
    .ranking-pos.bronze { color: #92400e; }
    .ranking-nombre { flex: 1; font-weight: 600; }
    .ranking-rend { font-size: 15px; font-weight: 700; }
    /* Ticker */
    .fila-instrumento {
      cursor: pointer;
    }
    .fila-instrumento.selected td { background: #eff6ff; }
    /* Panel docente */
    .panel-section { margin-bottom: 32px; }
    .panel-section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      color: var(--gris); margin-bottom: 12px;
      padding-bottom: 6px; border-bottom: 2px solid var(--fondo);
    }
    /* Tooltip */
    .info-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--azul); color: white;
      font-size: 10px; font-weight: 700; line-height: 1;
      cursor: default; margin-left: 5px; vertical-align: middle;
      flex-shrink: 0; border: none; padding: 0;
      opacity: .75; transition: opacity .15s;
    }
    .info-btn:hover { opacity: 1; }
    .tooltip-wrap {
      position: relative; display: inline-flex; align-items: center;
    }
    .tooltip-box {
      display: none;
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: #1e293b; color: #f8fafc;
      font-size: 12px; font-weight: 400; line-height: 1.5;
      padding: 8px 11px; border-radius: 7px;
      width: 220px; z-index: 999; pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .tooltip-box::after {
      content: "";
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 6px solid transparent; border-top-color: #1e293b;
    }
    .tooltip-wrap:hover .tooltip-box { display: block; }
    /* Responsive */
    @media (max-width: 600px) {
      .kpi { flex: 1 1 100%; }
      .nav-tabs { display: none; }
    }
  </style>
</head>

// ── API helper ─────────────────────────────────────────────────────────────
async function api(method, path, body, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || "Error de red");
  }
  return res.json();
}

function fmt(n) {
  return new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 2 }).format(n);
}
function fmtPct(n) {
  const sign = n >= 0 ? "+" : "";
  return `${sign}${n.toFixed(2)}%`;
}
function fmtFecha(iso) {
  return new Date(iso).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [modo, setModo] = useState("grupo"); // grupo | docente
  const [codigo, setCodigo] = useState("");
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function handleLogin(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      let data;
      if (modo === "grupo") {
        data = await api("POST", "/api/auth/grupo/login", { codigo_acceso: codigo });
      } else {
        const form = new URLSearchParams();
        form.append("username", user);
        form.append("password", pass);
        const res = await fetch(`${API_BASE}/api/auth/docente/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: form,
        });
        if (!res.ok) throw new Error("Credenciales incorrectas");
        data = await res.json();
      }
      onLogin(data);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (

        <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
          <button className={`btn ${modo === "grupo" ? "btn-primary" : "btn-outline"}`} style={{ flex: 1 }}
            onClick={() => setModo("grupo")}>Soy grupo</button>
          <button className={`btn ${modo === "docente" ? "btn-primary" : "btn-outline"}`} style={{ flex: 1 }}
            onClick={() => setModo("docente")}>Soy docente</button>
        </div>

        {error && <div className="alert alert-error">{error}</div>}

        <form onSubmit={handleLogin}>
          {modo === "grupo" ? (
            <div className="form-group">
              <label className="form-label">Código de acceso del grupo</label>
              <input
                value={codigo}
                onChange={e => setCodigo(e.target.value.toUpperCase())}

          </button>
        </form>
      </div>
    </div>
  );
}

// ── PERFIL ASIGNADO POR DOCENTE ────────────────────────────────────────────
function PerfilAsignadoPage({ token, onReady }) {
  const [perfil, setPerfil] = useState(null);
  const [loading, setLoading] = useState(true);
  const [polling, setPolling] = useState(false);

  const cargar = useCallback(async () => {
    try {
      const p = await api("GET", "/api/grupos/perfil", null, token);
      if (p.asignado) {
        setPerfil(p);
        return true;
      }
    } catch (e) {}
    return false;
  }, [token]);

  useEffect(() => {
    cargar().then(asignado => {
      setLoading(false);
      if (!asignado) {
        // Polling cada 15s esperando que el docente asigne
        setPolling(true);
        const id = setInterval(async () => {
          const ok = await cargar();
          if (ok) { clearInterval(id); setPolling(false); }
        }, 15000);
        return () => clearInterval(id);
      }
    });
  }, [cargar]);

  if (loading) return <div className="page"><div className="card">Verificando perfil...</div></div>;

  const ICONS = { conservador: "🛡️", moderado: "⚖️", agresivo: "🚀", libre: "🕊️" };
  const DESCRIP = {
    conservador: "Perfil conservador. El docente ha configurado restricciones para priorizar la preservación del capital.",
    moderado: "Perfil moderado. Equilibrio entre rendimiento y riesgo.",
    agresivo: "Perfil agresivo. Mayor tolerancia al riesgo en busca de retornos más altos.",
    libre: "Sin restricciones adicionales. El docente ha habilitado libertad total de operación.",
  };

  if (!perfil || !perfil.asignado) {
    return (
      <div className="encuesta-bloqueada">
        <div className="encuesta-bloqueada-card">
          <div className="encuesta-bloqueada-icon" style={{ fontSize: 42, marginBottom: 12 }}>⏳</div>
          <div className="encuesta-bloqueada-titulo">Esperando perfil del docente</div>
          <p className="encuesta-bloqueada-desc">

          {polling && (
            <p style={{ fontSize: 12, color: "var(--gris)", marginTop: 8 }}>
              <span className="spinner" style={{ marginRight: 6 }} />Verificando automáticamente...
            </p>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      <div className="card" style={{ textAlign: "center", padding: "48px 32px", maxWidth: 480, margin: "0 auto" }}>
        <div style={{ fontSize: 52, marginBottom: 12 }}>{ICONS[perfil.estilo] || "📋"}</div>
        <p style={{ fontSize: 12, fontWeight: 700, color: "var(--gris)", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>

        <div style={{ marginBottom: 16 }}>
          <span className={`badge badge-${perfil.estilo}`} style={{ fontSize: 16, padding: "6px 20px" }}>
            {perfil.estilo.charAt(0).toUpperCase() + perfil.estilo.slice(1)}
          </span>
        </div>
        <p style={{ color: "var(--gris)", fontSize: 14, lineHeight: 1.6, maxWidth: 380, margin: "0 auto 20px" }}>
          {DESCRIP[perfil.estilo] || "Perfil configurado por el docente."}
        </p>

        {/* Restricciones del perfil */}
        <div style={{ textAlign: "left", background: "var(--fondo, #f9fafb)", borderRadius: 10, padding: "16px 20px", marginBottom: 24 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--gris)", textTransform: "uppercase", marginBottom: 10 }}>Restricciones configuradas</div>
          {[

            perfil.max_pct_por_sector && `Máx. ${(perfil.max_pct_por_sector * 100).toFixed(0)}% por sector`,

// ── OPERAR ─────────────────────────────────────────────────────────────────
function Operar({ token, perfil }) {
  const [mercado, setMercado] = useState([]);
  const [seleccionado, setSeleccionado] = useState(null);
  const [tipo, setTipo] = useState("compra");
  const [cantidad, setCantidad] = useState("");
  const [preview, setPreview] = useState(null);
  const [modal, setModal] = useState(false);
  const [loading, setLoading] = useState(false);
  const [exito, setExito] = useState(null);
  const [error, setError] = useState("");
  const [justificacion, setJustificacion] = useState("");
  const [historial, setHistorial] = useState([]);
  const [historialKey, setHistorialKey] = useState(0);
  const [periodo, setPeriodo] = useState("sesion");
  const [chartZoom, setChartZoom] = useState(false);
  const [tabInstrumento, setTabInstrumento] = useState("operar");
  const [ratiosFundamentales, setRatiosFundamentales] = useState(null);
  const [ratiosLoading, setRatiosLoading] = useState(false);
  const chartRef = useRef(null);
  const chartInstanceRef = useRef(null);
  const chartZoomRef = useRef(null);
  const chartZoomInstanceRef = useRef(null);

  const cargarMercado = useCallback(async () => {
    try {
      const d = await api("GET", "/api/grupos/mercado", null, token);
      setMercado(d);
      // Incrementar clave para forzar recarga del historial
      setHistorialKey(k => k + 1);
    } catch (e) { console.error(e); }
  }, [token]);

  useEffect(() => { cargarMercado(); const id = setInterval(cargarMercado, 15000); return () => clearInterval(id); }, [cargarMercado]);

  // Cargar historial al seleccionar instrumento, cambiar período o cuando se actualizan precios
  useEffect(() => {
    if (!seleccionado) { setHistorial([]); return; }
    api("GET", `/api/grupos/mercado/${seleccionado.ticker}/historial?periodo=${periodo}`, null, token)
      .then(d => {
        // API devuelve {ticker, precios: [{t, p}]} — normalizar a {timestamp, precio}
        const pts = (d.precios || []).map(x => ({ timestamp: x.t, precio: x.p }));
        setHistorial(pts);
      })
      .catch(() => setHistorial([]));
  }, [seleccionado?.id, historialKey, periodo]);

  // Formatear label del eje X según el período
  function fmtLabel(isoStr, per) {
    const d = new Date(isoStr + "Z");
    if (per === "sesion") return d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    if (per === "1s") return d.toLocaleDateString("es-AR", { weekday: "short", hour: "2-digit", minute: "2-digit" });
    if (per === "1m") return d.toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" });
    if (per === "1a") return d.toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" });
    return d.toLocaleDateString("es-AR", { day: "2-digit", month: "short" });
  }

  // Dibujar/actualizar gráfico cuando cambia el historial
  useEffect(() => {
    if (!chartRef.current || historial.length === 0) return;
    if (chartInstanceRef.current) chartInstanceRef.current.destroy();
    const labels = historial.map(h => fmtLabel(h.timestamp, periodo));
    const datos = historial.map(h => h.precio);
    const primero = datos[0];
    const ultimo = datos[datos.length - 1];
    const color = ultimo >= primero ? "#16a34a" : "#dc2626";
    chartInstanceRef.current = new Chart(chartRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [{
          data: datos,
          borderColor: color,
          backgroundColor: color + "22",
          borderWidth: 1.5,
          pointRadius: 0,
          fill: true,
          tension: 0.3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => `$${ctx.parsed.y.toFixed(2)}` }
        }},
        scales: {
          x: { ticks: { maxTicksLimit: periodo === "1a" ? 6 : 4, font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, callback: v => `$${v.toFixed(0)}` }, grid: { color: "#e5e7eb" } }
        }
      }
    });
    return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
  }, [historial, periodo]);

  // ── Indicadores técnicos ──────────────────────────────────────────────────
  const [indicadores, setIndicadores] = useState({ ema10: false, ema: false, ema50: false, bb: false, rsi: false, macd: false });
  const chartRsiRef = useRef(null);
  const chartRsiInstanceRef = useRef(null);
  const chartMacdRef = useRef(null);
  const chartMacdInstanceRef = useRef(null);

  function toggleIndicador(ind) {
    setIndicadores(prev => ({ ...prev, [ind]: !prev[ind] }));
  }

  // Cálculos de indicadores sobre array de precios
  function calcEMA(precios, periodo) {
    const k = 2 / (periodo + 1);
    const ema = [precios[0]];
    for (let i = 1; i < precios.length; i++)
      ema.push(precios[i] * k + ema[i - 1] * (1 - k));
    // Primeros (periodo-1) puntos son cálidos pero inexactos — devolver null para no graficar
    return ema.map((v, i) => i < periodo - 1 ? null : v);
  }

  function calcBB(precios, n = 20) {
    const upper = [], lower = [], mid = [];
    for (let i = 0; i < precios.length; i++) {
      if (i < n - 1) { upper.push(null); lower.push(null); mid.push(null); continue; }
      const slice = precios.slice(i - n + 1, i + 1);
      const mean = slice.reduce((a, b) => a + b, 0) / n;
      const std = Math.sqrt(slice.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
      mid.push(mean);
      upper.push(mean + 2 * std);
      lower.push(mean - 2 * std);
    }
    return { upper, lower, mid };
  }

  function calcRSI(precios, n = 14) {
    const rsi = new Array(precios.length).fill(null);
    if (precios.length < n + 1) return rsi;
    let avgGain = 0, avgLoss = 0;
    for (let i = 1; i <= n; i++) {
      const d = precios[i] - precios[i - 1];
      if (d > 0) avgGain += d; else avgLoss += Math.abs(d);
    }
    avgGain /= n; avgLoss /= n;
    rsi[n] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
    for (let i = n + 1; i < precios.length; i++) {
      const d = precios[i] - precios[i - 1];
      const gain = d > 0 ? d : 0, loss = d < 0 ? Math.abs(d) : 0;
      avgGain = (avgGain * (n - 1) + gain) / n;
      avgLoss = (avgLoss * (n - 1) + loss) / n;
      rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
    }
    return rsi;
  }

  function calcMACD(precios) {
    const ema12 = calcEMA(precios, 12).map((v, i) => v ?? null);
    const ema26 = calcEMA(precios, 26).map((v, i) => v ?? null);
    const macdLine = ema12.map((v, i) => (v !== null && ema26[i] !== null) ? v - ema26[i] : null);
    // Signal: EMA 9 del macd (solo donde macd no es null)
    const filled = macdLine.filter(v => v !== null);
    const signalFilled = calcEMA(filled, 9);
    const signal = new Array(macdLine.length).fill(null);
    let idx = 0;
    for (let i = 0; i < macdLine.length; i++) {
      if (macdLine[i] !== null) { signal[i] = signalFilled[idx++]; }
    }
    const histo = macdLine.map((v, i) => (v !== null && signal[i] !== null) ? v - signal[i] : null);
    return { macdLine, signal, histo };
  }

  // Dibujar chart del modal zoom + subgráficos de indicadores
  useEffect(() => {
    if (!chartZoom || !chartZoomRef.current || historial.length === 0) return;

    const labels = historial.map(h => fmtLabel(h.timestamp, periodo));
    const datos = historial.map(h => h.precio);
    const primero = datos[0], ultimo = datos[datos.length - 1];

    // Datasets principales
    const datasets = [{

      data: datos,

      pointRadius: 0,
      fill: true,
      tension: 0.3,
      yAxisID: "y",
      order: 10,

    if (indicadores.ema10) {
      datasets.push({
        label: "EMA 10", data: calcEMA(datos, 10),

        fill: false, tension: 0.3, yAxisID: "y", order: 5,
      });
    }

    if (indicadores.ema) {
      datasets.push({
        label: "EMA 20", data: calcEMA(datos, 20),
        borderColor: "#f59e0b", borderWidth: 1.5, pointRadius: 0,
        fill: false, tension: 0.3, yAxisID: "y", order: 5,
      });
    }

    if (indicadores.ema50) {
      datasets.push({
        label: "EMA 50", data: calcEMA(datos, 50),

    if (indicadores.bb) {
      const bb = calcBB(datos, 20);
      datasets.push(
        { label: "BB Superior", data: bb.upper, borderColor: "#6366f1", borderWidth: 1, borderDash: [4,2], pointRadius: 0, fill: false, tension: 0.3, yAxisID: "y", order: 4 },
        { label: "BB Media",    data: bb.mid,   borderColor: "#6366f1", borderWidth: 1, pointRadius: 0, fill: false, tension: 0.3, yAxisID: "y", order: 4 },

    chartZoomInstanceRef.current = new Chart(chartZoomRef.current, {

      options: {

        },
        scales: {
          x: { ticks: { maxTicksLimit: 8, font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { font: { size: 11 }, callback: v => `$${v.toFixed(0)}` }, grid: { color: "#e5e7eb" } }
        }
      }
    });

    // Subgráfico RSI
    if (indicadores.rsi && chartRsiRef.current) {
      const rsiData = calcRSI(datos, 14);
      chartRsiInstanceRef.current = new Chart(chartRsiRef.current, {
        type: "line",
        data: {
          labels,
          datasets: [{ label: "RSI 14", data: rsiData, borderColor: "#8b5cf6", borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `RSI: ${ctx.parsed.y?.toFixed(1) ?? ""}` } } },
          scales: {
            x: { ticks: { display: false }, grid: { display: false } },
            y: { min: 0, max: 100, ticks: { font: { size: 10 }, callback: v => v },
              grid: { color: "#e5e7eb" },
              afterDraw: chart => {
                // Líneas de sobrecompra/sobreventa
                const ctx2 = chart.ctx;
                [30, 70].forEach(val => {
                  const y = chart.scales.y.getPixelForValue(val);
                  ctx2.save();
                  ctx2.strokeStyle = val === 70 ? "#dc2626" : "#16a34a";
                  ctx2.lineWidth = 1;
                  ctx2.setLineDash([4, 3]);
                  ctx2.beginPath();
                  ctx2.moveTo(chart.chartArea.left, y);
                  ctx2.lineTo(chart.chartArea.right, y);
                  ctx2.stroke();
                  ctx2.restore();
                });
              }
            }
          }
        }
      });
    }

    // Subgráfico MACD
    if (indicadores.macd && chartMacdRef.current) {
      const { macdLine, signal, histo } = calcMACD(datos);
      chartMacdInstanceRef.current = new Chart(chartMacdRef.current, {
        type: "bar",
        data: {
          labels,
          datasets: [
            { type: "bar",  label: "Histograma", data: histo,    backgroundColor: histo.map(v => v === null ? "transparent" : v >= 0 ? "#16a34a66" : "#dc262666"), borderWidth: 0, order: 2 },
            { type: "line", label: "MACD",       data: macdLine, borderColor: "#2563eb", borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3, order: 1 },
            { type: "line", label: "Señal",      data: signal,   borderColor: "#f59e0b", borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3, order: 1 },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: true, position: "top", labels: { font: { size: 10 }, boxWidth: 14 } },
            tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2) ?? ""}` } }
          },
          scales: {
            x: { ticks: { display: false }, grid: { display: false } },
            y: { ticks: { font: { size: 10 } }, grid: { color: "#e5e7eb" } }
          }
        }
      });
    }

    return () => {
      if (chartZoomInstanceRef.current) chartZoomInstanceRef.current.destroy();
      if (chartRsiInstanceRef.current) chartRsiInstanceRef.current.destroy();
      if (chartMacdInstanceRef.current) chartMacdInstanceRef.current.destroy();
    };
  }, [chartZoom, historial, periodo, indicadores]);

  async function cargarRatios(instrId) {

      setModal(true);

    } finally {

    }

        cantidad: parseInt(cantidad),
        confirmar_advertencia: true,
        justificacion: justificacion.trim(),

      setModal(false);
      setPreview(null);
      setCantidad("");
      setJustificacion("");
      setSeleccionado(null);
      cargarMercado();

      setError(e.message);
      setModal(false);
    } finally {
      setLoading(false);
    }

          <tbody>
            {mercado.map(i => (

                  {fmtPct(i.variacion_24h_pct)}

          </tbody>
        </table>

      {/* Panel flotante de orden */}
      {seleccionado && (

              style={{ background: "none", border: "none", cursor: "pointer", fontSize: 18, color: "var(--gris)", lineHeight: 1 }}>✕</button>
          </div>
          <div style={{ fontSize: 13, color: "var(--gris)" }}>{seleccionado.nombre}</div>
          <div style={{ fontSize: 20, fontWeight: 700 }}>{fmt(seleccionado.precio_actual)}
            <span style={{ fontSize: 13, marginLeft: 8 }} className={seleccionado.variacion_sesion_pct >= 0 ? "pos" : "neg"}>{fmtPct(seleccionado.variacion_sesion_pct)}</span>

              Estimado: {fmt(seleccionado.precio_actual * parseInt(cantidad))} + comisión (0.5%)
            </div>
          )}
          <button className="btn btn-primary" onClick={verPreview} disabled={!cantidad || loading} style={{ marginTop: "auto" }}>
            {loading && <span className="spinner" />}
            {tipo === "compra" ? "Ver preview compra" : "Ver preview venta"}
          </button>
          </>}

          {/* TAB: Fundamentos */}
          {tabInstrumento === "fundamentos" && (
            <div style={{ fontSize: 13 }}>
              {ratiosLoading && <div style={{ color: "var(--gris)", textAlign: "center", padding: "24px 0" }}><span className="spinner" /> Cargando datos...</div>}
              {ratiosFundamentales?.error && <div className="alert alert-warning" style={{ fontSize: 12 }}>No se pudieron obtener datos: {ratiosFundamentales.error}</div>}
              {ratiosFundamentales && !ratiosFundamentales.error && (() => {
                const r = ratiosFundamentales.ratios || {};
                const tipo_inst = seleccionado?.tipo;
                if (tipo_inst === "bono" || tipo_inst === "fci") {
                  return <div style={{ color: "var(--gris)", fontSize: 12, textAlign: "center", padding: "20px 0" }}>Ratios fundamentales no aplican para este tipo de instrumento.</div>;
                }
                const noData = Object.keys(r).length === 0;
                if (noData) return (
                  <div style={{ textAlign: "center", padding: "20px 0" }}>
                    <div style={{ color: "var(--gris)", fontSize: 12, marginBottom: 8 }}>Sin datos disponibles en Yahoo Finance.</div>
                    <div style={{ color: "var(--gris)", fontSize: 11 }}>El docente puede actualizarlos desde el panel de administración.</div>
                  </div>
                );
                const fmtRatio = (v, pct) => v == null ? "—" : pct ? `${(v * 100).toFixed(1)}%` : v.toFixed(2);
                const fmtCap = v => {
                  if (!v) return "—";
                  if (v >= 1e12) return `$${(v/1e12).toFixed(1)}T`;
                  if (v >= 1e9) return `$${(v/1e9).toFixed(1)}B`;
                  if (v >= 1e6) return `$${(v/1e6).toFixed(1)}M`;
                  return `$${v.toFixed(0)}`;
                };
                const filas = [
                  { label: "P/E (trailing)", val: fmtRatio(r.pe) },
                  { label: "P/E (forward)", val: fmtRatio(r.pe_forward) },
                  { label: "P/BV", val: fmtRatio(r.pb) },
                  { label: "EV/EBITDA", val: fmtRatio(r.ev_ebitda) },
                  { label: "Deuda/Equity", val: fmtRatio(r.deuda_ebitda) },
                  { label: "ROE", val: fmtRatio(r.roe, true) },
                  { label: "ROA", val: fmtRatio(r.roa, true) },
                  { label: "Div. Yield", val: fmtRatio(r.div_yield, true) },
                  { label: "Crec. Ingresos", val: fmtRatio(r.revenue_growth, true) },
                  { label: "Crec. Ganancias", val: fmtRatio(r.earnings_growth, true) },
                  { label: "Market Cap", val: fmtCap(r.market_cap) },
                ].filter(f => f.val !== "—");
                if (filas.length === 0) return (
                  <div style={{ textAlign: "center", padding: "20px 0" }}>
                    <div style={{ fontSize: 20, marginBottom: 8 }}>📊</div>
                    <div style={{ color: "var(--gris)", fontSize: 12, marginBottom: 4 }}>Sin datos disponibles aún.</div>
                    <div style={{ color: "var(--gris)", fontSize: 11 }}>El docente debe hacer clic en <strong>📊 Actualizar ratios</strong> desde el panel de administración.</div>
                  </div>
                );
                return <>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px 12px", marginBottom: 12 }}>
                    {filas.map(({ label, val }) => (
                      <div key={label} style={{ background: "#f8fafc", borderRadius: 6, padding: "8px 10px" }}>
                        <div style={{ fontSize: 10, color: "var(--gris)", marginBottom: 2 }}>{label}</div>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{val}</div>
                      </div>
                    ))}
                  </div>
                  {ratiosFundamentales.actualizados_en && (
                    <div style={{ fontSize: 10, color: "var(--gris)", textAlign: "right", marginTop: 4 }}>
                      Fuente: Yahoo Finance · Act. {new Date(ratiosFundamentales.actualizados_en + "Z").toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" })}
                    </div>
                  )}
                  <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 6, lineHeight: 1.4 }}>
                    * Datos de mercado real. No representan el precio del simulador.
                  </div>
                </>;
              })()}
              {!ratiosLoading && !ratiosFundamentales && (
                <div style={{ textAlign: "center", padding: "20px 0" }}>
                  <button className="btn btn-outline" style={{ fontSize: 12 }} onClick={() => cargarRatios(seleccionado.id)}>Cargar fundamentos</button>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* Modal de confirmación */}
      {modal && preview && (
        <div className="modal-overlay">
          <div className="modal">
            <div className="modal-title">Confirmar operación</div>
            <table style={{ marginBottom: 12 }}>
              <tbody>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Instrumento</td><td style={{ fontWeight: 700, textAlign: "right" }}>{preview.instrumento}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Tipo</td><td style={{ textAlign: "right", textTransform: "capitalize", color: preview.tipo === "compra" ? "var(--verde)" : "var(--rojo)", fontWeight: 700 }}>{preview.tipo}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Cantidad</td><td style={{ textAlign: "right" }}>{preview.cantidad}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Precio</td><td style={{ textAlign: "right" }}>{fmt(preview.precio)}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Comisión</td><td style={{ textAlign: "right" }}>{fmt(preview.comision)}</td></tr>
                <tr><td style={{ fontWeight: 700, paddingTop: 6 }}>Total</td><td style={{ fontWeight: 700, textAlign: "right", fontSize: 16 }}>{fmt(preview.monto_total)}</td></tr>
              </tbody>
            </table>

            {!preview.coherente_perfil && (
              <div className="alert alert-warning">{preview.advertencia}</div>
            )}

            <div style={{ marginTop: 14 }}>
              <label style={{ display: "block", fontSize: 13, fontWeight: 600, marginBottom: 6 }}>
                📝 Justificación de la decisión <span style={{ color: "var(--rojo)" }}>*</span>
              </label>
              <p style={{ fontSize: 11, color: "var(--gris)", marginBottom: 6, marginTop: 0 }}>
                Explicá brevemente por qué tomás esta decisión. Esto quedará registrado en tu bitácora.
              </p>
              <textarea
                value={justificacion}
                onChange={e => setJustificacion(e.target.value)}
                placeholder="Ej: La empresa publicó resultados positivos y el precio todavía no refleja la noticia…"
                rows={3}
                style={{
                  width: "100%",
                  padding: "8px 10px",
                  fontSize: 13,
                  border: "1px solid #d1d5db",
                  borderRadius: 6,
                  resize: "vertical",
                  fontFamily: "inherit",
                  boxSizing: "border-box",
                  outline: justificacion.trim() ? "none" : "2px solid #fbbf24",
                }}
              />
            </div>

            <div className="modal-actions">
              <button className="btn btn-outline" onClick={() => { setModal(false); setJustificacion(""); }}>Cancelar</button>
              <button
                className={`btn ${preview.tipo === "compra" ? "btn-success" : "btn-danger"}`}
                onClick={confirmar}
                disabled={loading || !justificacion.trim()}
              >
                {loading && <span className="spinner" />}
                {!preview.coherente_perfil ? "Confirmar igualmente" : "Confirmar"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── NOTICIAS ───────────────────────────────────────────────────────────────
function Noticias({ token, onNoLeidasChange }) {
  const [noticias, setNoticias] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expandida, setExpandida] = useState(null);

  useEffect(() => {
    api("GET", "/api/grupos/noticias", null, token)
      .then(ns => {
        setNoticias(ns);
        if (onNoLeidasChange) onNoLeidasChange(ns.filter(n => !n.leida).length);
      })
      .finally(() => setLoading(false));
  }, [token]);

  async function marcarLeida(id) {
    await api("POST", `/api/grupos/noticias/${id}/leer`, null, token);
    setNoticias(n => {
      const updated = n.map(x => x.id === id ? { ...x, leida: true } : x);
      if (onNoLeidasChange) onNoLeidasChange(updated.filter(x => !x.leida).length);
      return updated;
    });
  }

  if (loading) return <div className="page"><div className="card">Cargando noticias...</div></div>;

  const noLeidas = noticias.filter(n => !n.leida);
  const leidas = noticias.filter(n => n.leida);

  return (
    <div className="page">
      {noticias.length === 0 && (
        <div className="alert alert-info">No hay noticias disponibles por el momento.</div>
      )}

      {noLeidas.length > 0 && (
        <>
          <h3 style={{ fontSize: 13, fontWeight: 700, textTransform: "uppercase", color: "var(--gris)", marginBottom: 10 }}>
            No leídas ({noLeidas.length})
          </h3>
          {noLeidas.map(n => (
            <NoticiaCard key={n.id} noticia={n} expanded={expandida === n.id}
              onToggle={() => { setExpandida(expandida === n.id ? null : n.id); marcarLeida(n.id); }}
            />
          ))}
        </>
      )}

      {leidas.length > 0 && (
        <>
          <h3 style={{ fontSize: 13, fontWeight: 700, textTransform: "uppercase", color: "var(--gris)", marginBottom: 10, marginTop: 20 }}>
            Leídas ({leidas.length})
          </h3>
          {leidas.map(n => (
            <NoticiaCard key={n.id} noticia={n} expanded={expandida === n.id}
              onToggle={() => setExpandida(expandida === n.id ? null : n.id)}
            />
          ))}
        </>
      )}
    </div>
  );
}

function NoticiaCard({ noticia, expanded, onToggle }) {
  const tipoColor = noticia.tipo === "fundamental" ? "var(--azul)" : "var(--naranja)";
  const tipoLabel = noticia.tipo === "fundamental" ? "📰 Análisis fundamental" : "📈 Análisis técnico";

  return (
    <div className={`noticia-card ${noticia.tipo}`}
      style={{ opacity: noticia.leida ? 0.75 : 1, cursor: "pointer" }}
      onClick={onToggle}
    >
      <div className="noticia-tipo" style={{ color: tipoColor }}>{tipoLabel}
        {noticia.ticker_relacionado && <span style={{ marginLeft: 8, background: "#f3f4f6", padding: "1px 6px", borderRadius: 4, fontSize: 10 }}>{noticia.ticker_relacionado}</span>}
        {noticia.sector_relacionado && <span style={{ marginLeft: 6, background: "#ede9fe", color: "#7c3aed", padding: "1px 6px", borderRadius: 4, fontSize: 10 }}>{noticia.sector_relacionado}</span>}
        {noticia.impacto_pct && noticia.impacto_tipo && (
          <span style={{ marginLeft: 6, background: noticia.impacto_tipo === "suba" ? "#dcfce7" : "#fee2e2", color: noticia.impacto_tipo === "suba" ? "#166534" : "#991b1b", padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700 }}>
            {noticia.impacto_tipo === "suba" ? "▲" : "▼"} {noticia.impacto_pct}% short-term
          </span>
        )}
        {!noticia.leida && <span style={{ marginLeft: 8, background: "var(--azul)", color: "white", padding: "1px 6px", borderRadius: 4, fontSize: 10 }}>NUEVO</span>}
      </div>
      <div className="noticia-titulo">{noticia.titulo}</div>
      {expanded && (
        <div className="noticia-contenido" style={{ marginTop: 8, whiteSpace: "pre-wrap" }}>{noticia.contenido}</div>
      )}
      <div className="noticia-meta">
        {fmtFecha(noticia.publicado_en)}
        {noticia.duracion_horas && <span style={{ marginLeft: 6 }}>· ⏱ vence {fmtFecha(noticia.expira_en)}</span>}
        <span style={{ marginLeft: 6 }}>· {expanded ? "▲ Cerrar" : "▼ Leer más"}</span>
      </div>
    </div>
  );
}

// ── RANKING ────────────────────────────────────────────────────────────────
function Ranking({ token }) {
  const [ranking, setRanking] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api("GET", "/api/grupos/ranking", null, token)
      .then(setRanking)
      .finally(() => setLoading(false));
    const id = setInterval(() => {
      api("GET", "/api/grupos/ranking", null, token).then(setRanking);
    }, 30000);
    return () => clearInterval(id);
  }, [token]);

  if (loading) return <div className="page"><div className="card">Cargando ranking...</div></div>;

  const medallaColor = (pos) => pos === 1 ? "gold" : pos === 2 ? "silver" : pos === 3 ? "bronze" : "";
  const medalla = (pos) => pos === 1 ? "🥇" : pos === 2 ? "🥈" : pos === 3 ? "🥉" : pos;

  return (
    <div className="page">
      <div className="card">
        <div className="card-title">Ranking de grupos</div>
        {ranking.map(g => (
          <div key={g.grupo} className="ranking-row">
            <div className={`ranking-pos ${medallaColor(g.posicion)}`}>{medalla(g.posicion)}</div>
            <div className="ranking-nombre">{g.grupo}</div>
            <div>
              <div style={{ fontSize: 12, color: "var(--gris)" }}>{fmt(g.capital_total)}</div>
            </div>
            <div className={`ranking-rend ${g.rendimiento_pct >= 0 ? "pos" : "neg"}`}>
              {fmtPct(g.rendimiento_pct)}
            </div>
          </div>
        ))}
        {ranking.length === 0 && <p style={{ color: "var(--gris)", fontSize: 13 }}>Todavía no hay grupos con operaciones.</p>}
      </div>
    </div>
  );
}

  const [generandoIA, setGenerandoIA] = useState(false);
  const [precioObjetivo, setPrecioObjetivo] = useState("");

  // Reporte grupo seleccionado
  const [reporteGrupo, setReporteGrupo] = useState(null);

  // Configuración
  const [config, setConfig] = useState({ nombre_experiencia: "", capital_inicial: 1000000, comision: 0.006, activo: false, fecha_inicio: "", fecha_fin: "" });
  const [savingConfig, setSavingConfig] = useState(false);

  // Bitácoras
  const [bitacoras, setBitacoras] = useState([]);
  const [loadingBitacoras, setLoadingBitacoras] = useState(false);
  const [filtroBitacoraGrupo, setFiltroBitacoraGrupo] = useState("");

  // Informes finales (docente)
  const [informesDocente, setInformesDocente] = useState([]);
  const [loadingInformes, setLoadingInformes] = useState(false);
  const [informeSeleccionado, setInformeSeleccionado] = useState(null);

  // Métricas de riesgo por grupo
  const [metricasGrupos, setMetricasGrupos] = useState([]);
  const [loadingMetricas, setLoadingMetricas] = useState(false);

  // Instrumentos (para tab config)
  const [instrumentos, setInstrumentos] = useState([]);
  const [loadingInstr, setLoadingInstr] = useState(false);
  const [editandoInstr, setEditandoInstr] = useState({}); // id -> {sector, tendencia_esperada}
  const [savingInstr, setSavingInstr] = useState(null);

  // Perfil de grupo
  const [perfilGrupoModal, setPerfilGrupoModal] = useState(null); // { grupo_id, nombre }
  const [perfilForm, setPerfilForm] = useState({
    estilo: "moderado",
    max_pct_por_activo: "", max_pct_por_sector: "",
    min_activos: "", min_sectores: "",
    min_pct_renta_fija: "", max_pct_renta_fija: "",
    min_pct_renta_variable: "", max_pct_renta_variable: "",
    min_pct_liquidez: "", max_pct_liquidez: "",
    respetar_tendencia: false, notas: "",
  });
  const [savingPerfil, setSavingPerfil] = useState(false);

  const cargarGrupos  = useCallback(() => api("GET", "/api/docente/grupos",  null, token).then(setGrupos),   [token]);
  const cargarAlumnos = useCallback(() => api("GET", "/api/docente/alumnos", null, token).then(setAlumnos),  [token]);
  const cargarNoticias = useCallback(() => api("GET", "/api/docente/noticias", null, token).then(setNoticias), [token]);

  useEffect(() => {
    Promise.all([
      api("GET", "/api/docente/grupos", null, token),
      api("GET", "/api/docente/alumnos", null, token),
      api("GET", "/api/docente/noticias", null, token),
      api("GET", "/api/docente/reportes/ranking", null, token),
      api("GET", "/api/docente/configuracion", null, token),
    ]).then(([g, a, n, r, cfg]) => { setGrupos(g); setAlumnos(a); setNoticias(n); setRanking(r); setConfig(cfg); });
  }, [token]);

  // Cargar informes finales al entrar a la tab informes
  useEffect(() => {
    if (tab !== "informes") return;
    setLoadingInformes(true);
    api("GET", "/api/informes/docente/todos", null, token)
      .then(data => setInformesDocente(data))
      .catch(() => {})
      .finally(() => setLoadingInformes(false));
  }, [tab, token]);

  // Cargar bitácoras al entrar a la tab bitacoras
  useEffect(() => {
    if (tab !== "bitacoras") return;
    setLoadingBitacoras(true);
    api("GET", "/api/docente/reportes/bitacoras", null, token)
      .then(data => { setBitacoras(data); })
      .catch(() => {})
      .finally(() => setLoadingBitacoras(false));

  // Cargar métricas de riesgo al entrar a la tab metricas
  useEffect(() => {

      .then(data => { setMetricasGrupos(data); })
      .catch(() => {})

  // Cargar instrumentos al entrar a config o noticias

    if (instrumentos.length > 0) return; // ya cargados
    setLoadingInstr(true);
    api("GET", "/api/docente/instrumentos", null, token)
      .then(data => { setInstrumentos(data); })
      .catch(() => {})
      .finally(() => setLoadingInstr(false));

    setPerfilGrupoModal({ grupo_id: grupo.id, nombre: grupo.nombre });

    try {
      const p = await api("GET", `/api/docente/grupos/${grupo.id}/perfil`, null, token);
      if (p.asignado) {
        setPerfilForm({
          estilo: p.estilo || "moderado",

          max_pct_por_sector: p.max_pct_por_sector != null ? (p.max_pct_por_sector * 100).toFixed(0) : "",
          min_activos: p.min_activos ?? "",
          min_sectores: p.min_sectores ?? "",
          min_pct_renta_fija: p.min_pct_renta_fija != null ? (p.min_pct_renta_fija * 100).toFixed(0) : "",
          max_pct_renta_fija: p.max_pct_renta_fija != null ? (p.max_pct_renta_fija * 100).toFixed(0) : "",
          min_pct_renta_variable: p.min_pct_renta_variable != null ? (p.min_pct_renta_variable * 100).toFixed(0) : "",
          max_pct_renta_variable: p.max_pct_renta_variable != null ? (p.max_pct_renta_variable * 100).toFixed(0) : "",
          min_pct_liquidez: p.min_pct_liquidez != null ? (p.min_pct_liquidez * 100).toFixed(0) : "",
          max_pct_liquidez: p.max_pct_liquidez != null ? (p.max_pct_liquidez * 100).toFixed(0) : "",
          respetar_tendencia: p.respetar_tendencia || false,
          notas: p.notas || "",
        });
      } else {

      }
    } catch (e) {
      setPerfilForm({ estilo: "moderado", max_pct_por_activo: "", max_pct_por_sector: "", min_activos: "", min_sectores: "", min_pct_renta_fija: "", max_pct_renta_fija: "", min_pct_renta_variable: "", max_pct_renta_variable: "", min_pct_liquidez: "", max_pct_liquidez: "", respetar_tendencia: false, notas: "" });

  function pctToDecimal(val) {
    const n = parseFloat(val);
    return isNaN(n) ? null : n / 100;
  }

  async function guardarPerfil() {
    if (!perfilGrupoModal) return;
    setSavingPerfil(true);
    try {
      await api("PUT", `/api/docente/grupos/${perfilGrupoModal.grupo_id}/perfil`, {
        estilo: perfilForm.estilo,
        max_pct_por_activo: pctToDecimal(perfilForm.max_pct_por_activo),
        max_pct_por_sector: pctToDecimal(perfilForm.max_pct_por_sector),
        min_activos: perfilForm.min_activos !== "" ? parseInt(perfilForm.min_activos) : null,
        min_sectores: perfilForm.min_sectores !== "" ? parseInt(perfilForm.min_sectores) : null,
        min_pct_renta_fija: pctToDecimal(perfilForm.min_pct_renta_fija),
        max_pct_renta_fija: pctToDecimal(perfilForm.max_pct_renta_fija),
        min_pct_renta_variable: pctToDecimal(perfilForm.min_pct_renta_variable),
        max_pct_renta_variable: pctToDecimal(perfilForm.max_pct_renta_variable),
        min_pct_liquidez: pctToDecimal(perfilForm.min_pct_liquidez),
        max_pct_liquidez: pctToDecimal(perfilForm.max_pct_liquidez),
        respetar_tendencia: perfilForm.respetar_tendencia,
        notas: perfilForm.notas || null,
      }, token);
      flash("success", `Perfil asignado a ${perfilGrupoModal.nombre}`);
      // Recargar grupos para reflejar el perfil
      const g = await api("GET", "/api/docente/grupos", null, token);
      setGrupos(g);
      setPerfilGrupoModal(null);
    } catch (e) {
      flash("error", e.message);
    } finally {
      setSavingPerfil(false);
    }
  }

  async function guardarTendenciaInstr(id) {
    const cambios = editandoInstr[id];
    if (!cambios) return;
    setSavingInstr(id);
    try {
      // Convertir % ingresado (ej: "15.0") a decimal (0.15) para el backend
      const payload = { sector: cambios.sector };
      if (cambios.tendencia_esperada !== "" && cambios.tendencia_esperada !== null) {
        payload.tendencia_esperada = parseFloat(cambios.tendencia_esperada) / 100;
      } else {
        payload.tendencia_esperada = null;
      }
      const updated = await api("PUT", `/api/docente/instrumentos/${id}`, payload, token);
      setInstrumentos(prev => prev.map(i => i.id === id ? { ...i, ...updated } : i));
      setEditandoInstr(prev => { const n = { ...prev }; delete n[id]; return n; });
      flash("success", "Instrumento actualizado.");
    } catch (e) {
      flash("error", e.message);
    } finally {
      setSavingInstr(null);
    }
  }

  function flash(type, text) { setMsg({ type, text }); setTimeout(() => setMsg({ type: "", text: "" }), 4000); }

  async function crearGrupo() {
    if (!nuevoGrupo.trim()) return;
    try {
      const g = await api("POST", "/api/docente/grupos", { nombre: nuevoGrupo }, token);
      setGrupos(prev => [...prev, g]);
      setNuevoGrupo("");
      flash("success", `Grupo "${g.nombre}" creado. Código: ${g.codigo_acceso}`);
    } catch (e) { flash("error", e.message); }
  }

  async function subirCSV() {
    if (!csvFile) return;
    const form = new FormData();
    form.append("file", csvFile);
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/api/docente/alumnos/csv`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: form,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);
      const errs = data.errores || [];
      flash("success", `${data.creados} alumnos cargados.${errs.length ? " Errores: " + errs.join("; ") : ""}`);
      const al = await api("GET", "/api/docente/alumnos", null, token);
      setAlumnos(al);
    } catch (e) { flash("error", e.message); }
    finally { setLoading(false); setCsvFile(null); }
  }

  async function generarConIA() {
    const ticker = nuevaNoticia.ticker_relacionado;
    const sector = nuevaNoticia.sector_relacionado;
    if (!ticker && !sector) {
      flash("error", "Seleccioná un ticker o sector antes de generar con IA.");
      return;
    }
    if (!precioObjetivo || isNaN(parseFloat(precioObjetivo))) {
      flash("error", "Ingresá un precio objetivo válido.");
      return;
    }
    // Buscar precio actual del instrumento seleccionado
    let precioActual = null;
    let nombreInstr = null;
    if (ticker) {
      const instr = instrumentos.find(i => i.ticker === ticker);
      if (!instr) { flash("error", "No se encontró el instrumento."); return; }
      precioActual = instr.precio_actual;
      nombreInstr = instr.nombre;
    } else {
      // Para sector: usar precio promedio de los instrumentos del sector
      const del_sector = instrumentos.filter(i => i.sector === sector && i.precio_actual);
      if (!del_sector.length) { flash("error", "No hay instrumentos con precio en ese sector."); return; }
      precioActual = del_sector.reduce((s, i) => s + i.precio_actual, 0) / del_sector.length;
      nombreInstr = sector;
    }
    setGenerandoIA(true);
    try {
      const durH = nuevaNoticia.duracion_horas ? parseFloat(nuevaNoticia.duracion_horas) : 2.0;
      const result = await api("POST", "/api/docente/noticias/generar-ia", {
        ticker: ticker || null,
        sector: sector || null,
        nombre_instrumento: nombreInstr,
        precio_actual: precioActual,
        precio_objetivo: parseFloat(precioObjetivo),
        duracion_horas: durH,
      }, token);
      setNuevaNot(p => ({
        ...p,
        titulo: result.titulo,
        contenido: result.contenido,
        impacto_pct: String(result.impacto_pct),
        impacto_tipo: result.impacto_tipo,
        duracion_horas: p.duracion_horas || "2",
      }));
      flash("success", `✨ Noticia generada. Variación implícita: ${result.delta_pct > 0 ? "+" : ""}${result.delta_pct}%`);
    } catch (e) {
      flash("error", e.message);
    } finally {
      setGenerandoIA(false);
    }
  }

  async function publicarNoticia() {
    const { titulo, contenido, tipo, ticker_relacionado, sector_relacionado, publicado_en, duracion_horas, impacto_pct, impacto_tipo } = nuevaNoticia;
    if (!titulo || !contenido || !publicado_en) {
      flash("error", "Completá título, contenido y fecha de publicación.");
      return;
    }
    if (impacto_pct && !duracion_horas) {
      flash("error", "Si hay impacto en precio, especificá la duración del efecto.");
      return;
    }
    try {
      await api("POST", "/api/docente/noticias", {
        titulo, contenido, tipo,
        ticker_relacionado: ticker_relacionado || null,
        sector_relacionado: sector_relacionado || null,
        publicado_en: new Date(publicado_en).toISOString(),
        duracion_horas: duracion_horas ? parseFloat(duracion_horas) : null,
        impacto_pct: impacto_pct ? parseFloat(impacto_pct) : null,
        impacto_tipo: impacto_pct ? impacto_tipo : null,
      }, token);
      flash("success", "Noticia publicada.");
      setNuevaNot({ titulo: "", contenido: "", tipo: "fundamental", ticker_relacionado: "", sector_relacionado: "", publicado_en: "", duracion_horas: "", impacto_pct: "", impacto_tipo: "suba" });
      const n = await api("GET", "/api/docente/noticias", null, token);
      setNoticias(n);
    } catch (e) { flash("error", e.message); }
  }
