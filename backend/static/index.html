<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Cartera — Económicas UNICEN</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* ── Tokens de diseño ─────────────────────────────────────────── */
    :root {
      --azul:    #1452EF;
      --fondo:   #E7EAF1;
      --texto:   #282828;
      --blanco:  #ffffff;
      --gris:    #6b7280;
      --verde:   #16a34a;
      --rojo:    #dc2626;
      --naranja: #d97706;
      --sombra:  0 1px 3px rgba(0,0,0,.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Gantari', Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
    }
    /* Nav */
    .nav {
      background: var(--azul);
      color: var(--blanco);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .nav-brand { font-size: 16px; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
    .nav-logo { height: 32px; width: auto; display: block; border-radius: 6px; background: white; padding: 2px; }
    .nav-right { display: flex; align-items: center; gap: 16px; font-size: 13px; }
    .nav-tabs { display: flex; gap: 4px; }
    .tab-btn {
      background: transparent;
      color: rgba(255,255,255,.75);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }
    .tab-btn:hover { background: rgba(255,255,255,.12); color: var(--blanco); }
    .tab-btn.active { background: rgba(255,255,255,.22); color: var(--blanco); font-weight: 700; }
    .btn-logout {
      background: rgba(255,255,255,.15);
      color: var(--blanco);
      border: 1px solid rgba(255,255,255,.3);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    /* Layout */
    .page { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    /* Cards */
    .card {
      background: var(--blanco);
      border-radius: 12px;
      box-shadow: var(--sombra);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--azul); }
    /* KPI row */
    .kpi-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .kpi {
      background: var(--blanco);
      border-radius: 10px;
      padding: 14px 18px;
      flex: 1 1 160px;
      box-shadow: var(--sombra);
    }
    .kpi-label { font-size: 11px; color: var(--gris); text-transform: uppercase; margin-bottom: 4px; }
    .kpi-value { font-size: 20px; font-weight: 700; }
    .kpi-value.pos { color: var(--verde); }
    .kpi-value.neg { color: var(--rojo); }
    /* Tablas */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; color: var(--gris); border-bottom: 2px solid var(--fondo); }
    td { padding: 10px 10px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #f8f9ff; }
    .pos { color: var(--verde); font-weight: 600; }
    .neg { color: var(--rojo); font-weight: 600; }
    /* Botones */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--azul); color: var(--blanco); }
    .btn-success { background: var(--verde); color: var(--blanco); }
    .btn-danger  { background: var(--rojo);  color: var(--blanco); }
    .btn-outline { background: transparent; color: var(--azul); border: 1.5px solid var(--azul); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    /* Formularios */
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--azul); }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--gris); text-transform: uppercase; }
    /* Alertas */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .alert-warning { background: #fffbeb; border: 1.5px solid #fbbf24; color: #92400e; }
    .alert-error   { background: #fef2f2; border: 1.5px solid #fca5a5; color: #7f1d1d; }
    .alert-success { background: #f0fdf4; border: 1.5px solid #86efac; color: #14532d; }
    .alert-info    { background: #eff6ff; border: 1.5px solid #93c5fd; color: #1e3a8a; }
    /* Badge perfil */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-conservador { background: #dbeafe; color: #1e40af; }
    .badge-moderado    { background: #fef3c7; color: #92400e; }
    .badge-agresivo    { background: #fee2e2; color: #991b1b; }
    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--blanco);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .login-sub { color: var(--gris); font-size: 13px; margin-bottom: 28px; }
    /* Encuesta */
    .encuesta-header {
      background: var(--blanco);
      border-radius: 14px;
      padding: 22px 24px 18px;
      box-shadow: var(--sombra);
      margin-bottom: 20px;
    }
    .encuesta-header h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .encuesta-header p { color: var(--gris); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .progreso-barra {
      background: #e5e7eb;
      border-radius: 8px;
      height: 7px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progreso-fill {
      background: var(--azul);
      height: 100%;
      border-radius: 8px;
      transition: width .35s ease;
    }
    .progreso-label { font-size: 11px; color: var(--gris); }
    .pregunta-card {
      background: var(--blanco);
      border-radius: 14px;
      padding: 22px 22px 16px;
      box-shadow: var(--sombra);
      margin-bottom: 14px;
    }
    .pregunta-num {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--azul);
      background: #eff6ff;
      border-radius: 20px;
      padding: 2px 10px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .pregunta-texto { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
    .opcion {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      gap: 12px;
      padding: 11px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s, box-shadow .15s;
      user-select: none;
    }
    .opcion:hover { border-color: var(--azul); background: #f5f8ff; }
    .opcion.selected {
      border-color: var(--azul);
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(20,82,239,.08);
    }
    .opcion input[type=radio] { display: none; }
    .opcion-radio {
      flex-shrink: 0;
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .opcion.selected .opcion-radio {
      border-color: var(--azul);
      background: var(--azul);
    }
    .opcion-radio-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      transition: opacity .15s;
    }
    .opcion.selected .opcion-radio-dot { opacity: 1; }
    .opcion-texto { font-size: 14px; line-height: 1.4; flex: 1; }
    /* Noticia */
    .noticia-card {
      border-left: 4px solid var(--azul);
      padding: 14px 16px;
      background: var(--blanco);
      border-radius: 0 10px 10px 0;
      margin-bottom: 12px;
      box-shadow: var(--sombra);
    }
    .noticia-card.fundamental { border-color: var(--azul); }
    .noticia-card.tecnico { border-color: var(--naranja); }
    .noticia-tipo { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .noticia-titulo { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .noticia-contenido { font-size: 13px; color: var(--gris); line-height: 1.5; }
    .noticia-meta { font-size: 11px; color: #9ca3af; margin-top: 8px; }
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .modal {
      background: var(--blanco);
      border-radius: 14px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,.2);
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    /* Encuesta bloqueada */
    .encuesta-bloqueada {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .encuesta-bloqueada-card {
      background: var(--blanco);
      border-radius: 16px;
      box-shadow: var(--sombra);
      padding: 48px 32px;
      text-align: center;
    }
    .encuesta-bloqueada-icon { font-size: 48px; margin-bottom: 16px; }
    .encuesta-bloqueada-titulo { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .encuesta-bloqueada-desc { color: var(--gris); font-size: 14px; line-height: 1.6; max-width: 360px; margin: 0 auto 24px; }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: #1e293b;
      color: white;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      z-index: 9999;
      white-space: nowrap;
      animation: toastIn .2s ease, toastOut .3s ease 2.5s forwards;
    }
    @keyframes toastIn  { from { opacity:0; transform: translateX(-50%) translateY(12px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateX(-50%) translateY(8px); } }
    /* Spinner */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Ranking */
    .ranking-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .ranking-pos { font-size: 20px; font-weight: 800; width: 32px; text-align: center; color: var(--azul); }
    .ranking-pos.gold { color: #d97706; }
    .ranking-pos.silver { color: #6b7280; }
    .ranking-pos.bronze { color: #92400e; }
    .ranking-nombre { flex: 1; font-weight: 600; }
    .ranking-rend { font-size: 15px; font-weight: 700; }
    /* Ticker */
    .fila-instrumento {
      cursor: pointer;
    }
    .fila-instrumento.selected td { background: #eff6ff; }
    /* Panel docente */
    .panel-section { margin-bottom: 32px; }
    .panel-section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      color: var(--gris); margin-bottom: 12px;
      padding-bottom: 6px; border-bottom: 2px solid var(--fondo);
    }
    /* Responsive */
    @media (max-width: 600px) {
      .kpi { flex: 1 1 100%; }
      .nav-tabs { display: none; }
    }
  </style>
</head>

// ── API helper ─────────────────────────────────────────────────────────────
async function api(method, path, body, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || "Error de red");
  }
  return res.json();
}

function fmt(n) {
  return new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 2 }).format(n);
}
function fmtPct(n) {
  const sign = n >= 0 ? "+" : "";
  return `${sign}${n.toFixed(2)}%`;
}
function fmtFecha(iso) {
  return new Date(iso).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [modo, setModo] = useState("grupo"); // grupo | docente
  const [codigo, setCodigo] = useState("");
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function handleLogin(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      let data;
      if (modo === "grupo") {
        data = await api("POST", "/api/auth/grupo/login", { codigo_acceso: codigo });
      } else {
        const form = new URLSearchParams();
        form.append("username", user);
        form.append("password", pass);
        const res = await fetch(`${API_BASE}/api/auth/docente/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: form,
        });
        if (!res.ok) throw new Error("Credenciales incorrectas");
        data = await res.json();
      }
      onLogin(data);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">
          <img src={LOGO_FCE} style={{width:40,height:40,borderRadius:8}} alt="FCE UNICEN" />
        </div>
        <div className="login-title">Simulador de Cartera</div>
        <div className="login-sub">Económicas · UNICEN · Tandil</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
          <button className={`btn ${modo === "grupo" ? "btn-primary" : "btn-outline"}`} style={{ flex: 1 }}
            onClick={() => setModo("grupo")}>Soy grupo</button>
          <button className={`btn ${modo === "docente" ? "btn-primary" : "btn-outline"}`} style={{ flex: 1 }}
            onClick={() => setModo("docente")}>Soy docente</button>
        </div>

        {error && <div className="alert alert-error">{error}</div>}

        <form onSubmit={handleLogin}>
          {modo === "grupo" ? (
            <div className="form-group">
              <label className="form-label">Código de acceso del grupo</label>
              <input
                value={codigo}
                onChange={e => setCodigo(e.target.value.toUpperCase())}
                placeholder="Ej: GRP-01"
                autoFocus
              />
            </div>
          ) : (
            <>
              <div className="form-group">
                <label className="form-label">Usuario</label>
                <input value={user} onChange={e => setUser(e.target.value)} placeholder="docente" autoFocus />
              </div>
              <div className="form-group">
                <label className="form-label">Contraseña</label>
                <input type="password" value={pass} onChange={e => setPass(e.target.value)} />
              </div>
            </>
          )}
          <button className="btn btn-primary" style={{ width: "100%", marginTop: 8 }} disabled={loading}>
            {loading && <span className="spinner" />}
            {loading ? "Ingresando..." : "Ingresar"}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── PERFIL ASIGNADO POR DOCENTE ────────────────────────────────────────────
function PerfilAsignadoPage({ token, onReady }) {
  const [perfil, setPerfil] = useState(null);
  const [loading, setLoading] = useState(true);
  const [polling, setPolling] = useState(false);

  const cargar = useCallback(async () => {
    try {
      const p = await api("GET", "/api/grupos/perfil", null, token);
      if (p.asignado) {
        setPerfil(p);
        return true;
      }
    } catch (e) {}
    return false;
  }, [token]);

  useEffect(() => {
    cargar().then(asignado => {
      setLoading(false);
      if (!asignado) {
        // Polling cada 15s esperando que el docente asigne
        setPolling(true);
        const id = setInterval(async () => {
          const ok = await cargar();
          if (ok) { clearInterval(id); setPolling(false); }
        }, 15000);
        return () => clearInterval(id);
      }
    });
  }, [cargar]);

  if (loading) return <div className="page"><div className="card">Verificando perfil...</div></div>;

  const ICONS = { conservador: "🛡️", moderado: "⚖️", agresivo: "🚀", libre: "🕊️" };
  const DESCRIP = {
    conservador: "Perfil conservador. El docente ha configurado restricciones para priorizar la preservación del capital.",
    moderado: "Perfil moderado. Equilibrio entre rendimiento y riesgo.",
    agresivo: "Perfil agresivo. Mayor tolerancia al riesgo en busca de retornos más altos.",
    libre: "Sin restricciones adicionales. El docente ha habilitado libertad total de operación.",
  };

  if (!perfil || !perfil.asignado) {
    return (
      <div className="encuesta-bloqueada">
        <div className="encuesta-bloqueada-card">
          <div className="encuesta-bloqueada-icon" style={{ fontSize: 42, marginBottom: 12 }}>⏳</div>
          <div className="encuesta-bloqueada-titulo">Esperando perfil del docente</div>
          <p className="encuesta-bloqueada-desc">
            Tu grupo aún no tiene un perfil inversor asignado. El docente lo configurará antes de comenzar la simulación.
          </p>
          {polling && (
            <p style={{ fontSize: 12, color: "var(--gris)", marginTop: 8 }}>
              <span className="spinner" style={{ marginRight: 6 }} />Verificando automáticamente...
            </p>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      <div className="card" style={{ textAlign: "center", padding: "48px 32px", maxWidth: 480, margin: "0 auto" }}>
        <div style={{ fontSize: 52, marginBottom: 12 }}>{ICONS[perfil.estilo] || "📋"}</div>
        <p style={{ fontSize: 12, fontWeight: 700, color: "var(--gris)", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>
          Perfil inversor asignado por el docente
        </p>
        <div style={{ marginBottom: 16 }}>
          <span className={`badge badge-${perfil.estilo}`} style={{ fontSize: 16, padding: "6px 20px" }}>
            {perfil.estilo.charAt(0).toUpperCase() + perfil.estilo.slice(1)}
          </span>
        </div>
        <p style={{ color: "var(--gris)", fontSize: 14, lineHeight: 1.6, maxWidth: 380, margin: "0 auto 20px" }}>
          {DESCRIP[perfil.estilo] || "Perfil configurado por el docente."}
        </p>

        {/* Restricciones del perfil */}
        <div style={{ textAlign: "left", background: "var(--fondo, #f9fafb)", borderRadius: 10, padding: "16px 20px", marginBottom: 24 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--gris)", textTransform: "uppercase", marginBottom: 10 }}>Restricciones configuradas</div>
          {[
            perfil.max_pct_por_activo && `Máx. ${(perfil.max_pct_por_activo * 100).toFixed(0)}% por activo`,
            perfil.max_pct_por_sector && `Máx. ${(perfil.max_pct_por_sector * 100).toFixed(0)}% por sector`,
            perfil.min_activos && `Mín. ${perfil.min_activos} activos distintos`,
            perfil.min_sectores && `Mín. ${perfil.min_sectores} sectores`,
            (perfil.min_pct_renta_fija || perfil.max_pct_renta_fija) && `Renta fija: ${perfil.min_pct_renta_fija ? (perfil.min_pct_renta_fija * 100).toFixed(0) + "%" : "0%"} – ${perfil.max_pct_renta_fija ? (perfil.max_pct_renta_fija * 100).toFixed(0) + "%" : "100%"}`,
            (perfil.min_pct_renta_variable || perfil.max_pct_renta_variable) && `Renta variable: ${perfil.min_pct_renta_variable ? (perfil.min_pct_renta_variable * 100).toFixed(0) + "%" : "0%"} – ${perfil.max_pct_renta_variable ? (perfil.max_pct_renta_variable * 100).toFixed(0) + "%" : "100%"}`,
            (perfil.min_pct_liquidez || perfil.max_pct_liquidez) && `Liquidez: ${perfil.min_pct_liquidez ? (perfil.min_pct_liquidez * 100).toFixed(0) + "%" : "0%"} – ${perfil.max_pct_liquidez ? (perfil.max_pct_liquidez * 100).toFixed(0) + "%" : "100%"}`,
            perfil.respetar_tendencia && `Respetar tendencia esperada de cada instrumento`,
          ].filter(Boolean).map((r, i) => (
            <div key={i} style={{ fontSize: 13, paddingBottom: 5, display: "flex", alignItems: "center", gap: 7 }}>
              <span style={{ color: "var(--azul)", fontSize: 10 }}>●</span> {r}
            </div>
          ))}
          {[
            perfil.max_pct_por_activo, perfil.max_pct_por_sector, perfil.min_activos, perfil.min_sectores,
            perfil.min_pct_renta_fija, perfil.max_pct_renta_fija, perfil.min_pct_renta_variable, perfil.max_pct_renta_variable,
            perfil.min_pct_liquidez, perfil.max_pct_liquidez, perfil.respetar_tendencia,
          ].every(v => !v) && (
            <p style={{ color: "var(--gris)", fontSize: 13, margin: 0 }}>Sin restricciones específicas (perfil libre).</p>
          )}
          {perfil.notas && (
            <div style={{ marginTop: 10, fontSize: 12, color: "var(--texto)", background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 6, padding: "8px 12px" }}>
              📝 {perfil.notas}
            </div>
          )}
        </div>

        <button className="btn btn-primary" onClick={() => onReady(perfil.estilo)}>
          Ir al simulador →
        </button>
      </div>
    </div>
  );
}

// ── MI CARTERA ─────────────────────────────────────────────────────────────
function MiCartera({ token, perfil }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [subTab, setSubTab] = useState("posiciones");
  const [movimientos, setMovimientos] = useState([]);
  const [loadingMov, setLoadingMov] = useState(false);

  const cargar = useCallback(async () => {
    try {
      const d = await api("GET", "/api/grupos/cartera", null, token);
      setData(d);
    } catch (e) { console.error(e); }
    finally { setLoading(false); }
  }, [token]);

  useEffect(() => { cargar(); const id = setInterval(cargar, 15000); return () => clearInterval(id); }, [cargar]);

  useEffect(() => {
    if (subTab !== "movimientos") return;
    setLoadingMov(true);
    api("GET", "/api/grupos/movimientos", null, token)
      .then(setMovimientos)
      .catch(() => {})
      .finally(() => setLoadingMov(false));
  }, [subTab, token]);

  if (loading) return <div className="page"><div className="card">Cargando cartera...</div></div>;
  if (!data) return <div className="page"><div className="alert alert-error">Error al cargar cartera.</div></div>;

  const rend = data.rendimiento_pct;

  const TIPO_COLOR = { compra: "var(--verde)", venta: "var(--rojo)", caucion_c: "#6366f1", caucion_t: "#6366f1", suscripcion: "#0ea5e9", rescate: "#f59e0b" };

  return (
    <div className="page">

        <div className="kpi">
          <div className="kpi-label">Efectivo disponible</div>
          <div className="kpi-value">{fmt(data.capital_disponible)}</div>

            <div style={{ fontSize: 11, color: "var(--gris)", marginTop: 2 }}>{data.pct_disponible.toFixed(1)}% del capital</div>
          )}
        </div>
        <div className="kpi">
          <div className="kpi-label">Valor de cartera</div>
          <div className="kpi-value">{fmt(data.valor_cartera)}</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Capital total</div>
          <div className="kpi-value">{fmt(data.capital_total)}</div>

      {/* Sub-tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {[{ id: "posiciones", label: "Posiciones abiertas" }, { id: "movimientos", label: "Movimientos" }].map(t => (
          <button key={t.id} className={`btn btn-sm ${subTab === t.id ? "btn-primary" : "btn-outline"}`}
            onClick={() => setSubTab(t.id)}>{t.label}</button>
        ))}

      {subTab === "posiciones" && (
        <div className="card">
          <div className="card-title">Posiciones abiertas</div>

            <p style={{ color: "var(--gris)", fontSize: 13 }}>Todavía no tenés posiciones. Ingresá a la pantalla <b>Operar</b> para comprar activos.</p>

              <tbody>

                    <td style={{ color: "var(--gris)" }}>{p.nombre}</td>

                    <td>
                      <span style={{ fontWeight: 600, color: TIPO_COLOR[m.tipo] || "var(--texto)" }}>

// ── OPERAR ─────────────────────────────────────────────────────────────────
function Operar({ token, perfil }) {
  const [mercado, setMercado] = useState([]);
  const [seleccionado, setSeleccionado] = useState(null);
  const [tipo, setTipo] = useState("compra");
  const [cantidad, setCantidad] = useState("");
  const [preview, setPreview] = useState(null);
  const [modal, setModal] = useState(false);
  const [loading, setLoading] = useState(false);
  const [exito, setExito] = useState(null);
  const [error, setError] = useState("");
  const [justificacion, setJustificacion] = useState("");   // bitácora: razón de la operación
  const [historial, setHistorial] = useState([]);
  const [historialKey, setHistorialKey] = useState(0);
  const chartRef = useRef(null);
  const chartInstanceRef = useRef(null);

  const cargarMercado = useCallback(async () => {
    try {
      const d = await api("GET", "/api/grupos/mercado", null, token);
      setMercado(d);
      // Incrementar clave para forzar recarga del historial
      setHistorialKey(k => k + 1);
    } catch (e) { console.error(e); }
  }, [token]);

  useEffect(() => { cargarMercado(); const id = setInterval(cargarMercado, 15000); return () => clearInterval(id); }, [cargarMercado]);

  // Cargar historial al seleccionar instrumento o cuando se actualizan precios
  useEffect(() => {
    if (!seleccionado) { setHistorial([]); return; }
    api("GET", `/api/grupos/mercado/${seleccionado.ticker}/historial`, null, token)
      .then(d => {
        // API devuelve {ticker, precios: [{t, p}]} — normalizar a {timestamp, precio}
        const pts = (d.precios || []).map(x => ({ timestamp: x.t, precio: x.p }));
        setHistorial(pts);
      })
      .catch(() => setHistorial([]));
  }, [seleccionado?.id, historialKey]);

  // Dibujar/actualizar gráfico cuando cambia el historial
  useEffect(() => {
    if (!chartRef.current || historial.length === 0) return;
    if (chartInstanceRef.current) chartInstanceRef.current.destroy();
    const labels = historial.map(h => {
      const d = new Date(h.timestamp);
      return d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    });
    const datos = historial.map(h => h.precio);
    const primero = datos[0];
    const ultimo = datos[datos.length - 1];
    const color = ultimo >= primero ? "#16a34a" : "#dc2626";
    chartInstanceRef.current = new Chart(chartRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [{
          data: datos,
          borderColor: color,
          backgroundColor: color + "22",
          borderWidth: 1.5,
          pointRadius: 0,
          fill: true,
          tension: 0.3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => `$${ctx.parsed.y.toFixed(2)}` }
        }},
        scales: {
          x: { ticks: { maxTicksLimit: 4, font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, callback: v => `$${v.toFixed(0)}` }, grid: { color: "#e5e7eb" } }
        }
      }
    });
    return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
  }, [historial]);

  async function verPreview() {
    if (!seleccionado || !cantidad || parseInt(cantidad) <= 0) return;
    setError(""); setLoading(true);
    try {
      const data = await api("POST", "/api/grupos/operar/preview", {
        instrumento_id: seleccionado.id,
        tipo,
        cantidad: parseInt(cantidad),
      }, token);
      setPreview(data);
      setModal(true);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  async function confirmar() {
    if (!justificacion.trim()) {
      setError("Debés completar la justificación antes de confirmar la operación.");
      return;
    }
    setLoading(true);
    try {
      const data = await api("POST", "/api/grupos/operar", {
        instrumento_id: seleccionado.id,
        tipo,
        cantidad: parseInt(cantidad),
        confirmar_advertencia: true,
        justificacion: justificacion.trim(),
      }, token);
      setExito(data);
      setModal(false);
      setPreview(null);
      setCantidad("");
      setSeleccionado(null);
      setJustificacion("");
      cargarMercado();
    } catch (e) {
      setError(e.message);
      setModal(false);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="page" style={{ paddingRight: seleccionado ? 300 : 0, transition: "padding-right .2s" }}>
      {exito && (
        <div className="alert alert-success">
          ✅ {exito.tipo === "compra" ? "Compra" : "Venta"} ejecutada: {exito.cantidad} {exito.instrumento} @ {fmt(exito.precio)} | Total: {fmt(exito.monto_total)}
          <button onClick={() => setExito(null)} style={{ float: "right", background: "none", border: "none", cursor: "pointer" }}>✕</button>
        </div>
      )}
      {error && <div className="alert alert-error">{error} <button onClick={() => setError("")} style={{ float: "right", background: "none", border: "none", cursor: "pointer" }}>✕</button></div>}

      <div className="card">
        <div className="card-title">Instrumentos disponibles</div>
        <p style={{ fontSize: 12, color: "var(--gris)", marginBottom: 10 }}>Hacé clic en una fila para operar</p>
        <table>
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Nombre</th>
              <th>Tipo</th>
              <th style={{ textAlign: "right" }}>Precio</th>
              <th style={{ textAlign: "right" }}>Var. sesión</th>
              <th style={{ textAlign: "right" }}>Var. 24hs</th>
            </tr>
          </thead>
          <tbody>
            {mercado.map(i => (
              <tr
                key={i.id}
                className={`fila-instrumento ${seleccionado?.id === i.id ? "selected" : ""}`}
                onClick={() => { setSeleccionado(i); setCantidad(""); setError(""); setPreview(null); }}
              >
                <td><b>{i.ticker}</b></td>
                <td style={{ color: "var(--gris)" }}>{i.nombre}</td>
                <td><span className="badge" style={{ background: "#f3f4f6", color: "#374151" }}>{i.tipo}</span></td>
                <td style={{ textAlign: "right" }}>{fmt(i.precio_actual)}</td>
                <td style={{ textAlign: "right" }} className={i.variacion_sesion_pct >= 0 ? "pos" : "neg"}>
                  {fmtPct(i.variacion_sesion_pct)}
                </td>
                <td style={{ textAlign: "right" }} className={i.variacion_24h_pct >= 0 ? "pos" : "neg"}>
                  {fmtPct(i.variacion_24h_pct)}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Panel flotante de orden */}
      {seleccionado && (
        <div style={{
          position: "fixed",
          top: 56,
          right: 0,
          width: 288,
          height: "calc(100vh - 56px)",
          background: "var(--blanco)",
          borderLeft: "1.5px solid var(--borde, #d1d5db)",
          boxShadow: "-4px 0 16px rgba(0,0,0,.1)",
          overflowY: "auto",
          padding: "20px 18px",
          zIndex: 100,
          display: "flex",
          flexDirection: "column",
          gap: 14,
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}>Orden — {seleccionado.ticker}</div>
            <button onClick={() => { setSeleccionado(null); setCantidad(""); setError(""); setPreview(null); }}
              style={{ background: "none", border: "none", cursor: "pointer", fontSize: 18, color: "var(--gris)", lineHeight: 1 }}>✕</button>
          </div>
          <div style={{ fontSize: 13, color: "var(--gris)" }}>{seleccionado.nombre}</div>
          <div style={{ fontSize: 20, fontWeight: 700 }}>{fmt(seleccionado.precio_actual)}
            <span style={{ fontSize: 13, marginLeft: 8 }} className={seleccionado.variacion_sesion_pct >= 0 ? "pos" : "neg"}>{fmtPct(seleccionado.variacion_sesion_pct)}</span>
          </div>
          {/* Gráfico de cotización */}
          <div style={{ height: 110, position: "relative" }}>
            {historial.length > 1
              ? <canvas ref={chartRef} />
              : <div style={{ height: "100%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: "var(--gris)" }}>Cargando historial...</div>
            }
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button className={`btn btn-sm ${tipo === "compra" ? "btn-success" : "btn-outline"}`} style={{ flex: 1 }} onClick={() => setTipo("compra")}>Compra</button>
            <button className={`btn btn-sm ${tipo === "venta" ? "btn-danger" : "btn-outline"}`} style={{ flex: 1 }} onClick={() => setTipo("venta")}>Venta</button>
          </div>
          <div className="form-group" style={{ marginBottom: 0 }}>
            <label className="form-label">Cantidad</label>
            <input
              type="number"
              min="1"
              value={cantidad}
              onChange={e => setCantidad(e.target.value)}
              placeholder="Ej: 100"
            />
          </div>
          {cantidad && parseInt(cantidad) > 0 && (
            <div className="alert alert-info" style={{ fontSize: 13, padding: "8px 12px" }}>

            </div>
          )}
          <button className="btn btn-primary" onClick={verPreview} disabled={!cantidad || loading} style={{ marginTop: "auto" }}>
            {loading && <span className="spinner" />}
            {tipo === "compra" ? "Ver preview compra" : "Ver preview venta"}
          </button>
        </div>
      )}

      {/* Modal de confirmación */}
      {modal && preview && (
        <div className="modal-overlay">
          <div className="modal">
            <div className="modal-title">Confirmar operación</div>
            <table style={{ marginBottom: 12 }}>
              <tbody>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Instrumento</td><td style={{ fontWeight: 700, textAlign: "right" }}>{preview.instrumento}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Tipo</td><td style={{ textAlign: "right", textTransform: "capitalize", color: preview.tipo === "compra" ? "var(--verde)" : "var(--rojo)", fontWeight: 700 }}>{preview.tipo}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Cantidad</td><td style={{ textAlign: "right" }}>{preview.cantidad}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Precio</td><td style={{ textAlign: "right" }}>{fmt(preview.precio)}</td></tr>
                <tr><td style={{ color: "var(--gris)", paddingBottom: 6 }}>Comisión</td><td style={{ textAlign: "right" }}>{fmt(preview.comision)}</td></tr>
                <tr><td style={{ fontWeight: 700, paddingTop: 6 }}>Total</td><td style={{ fontWeight: 700, textAlign: "right", fontSize: 16 }}>{fmt(preview.monto_total)}</td></tr>
              </tbody>
            </table>

            {!preview.coherente_perfil && (
              <div className="alert alert-warning">{preview.advertencia}</div>
            )}

            {/* Bitácora de decisiones — campo obligatorio */}
            <div className="form-group" style={{ marginBottom: 12 }}>
              <label className="form-label" style={{ fontWeight: 600 }}>
                📓 Justificación de la operación <span style={{ color: "var(--rojo)" }}>*</span>
              </label>
              <textarea
                rows={3}
                value={justificacion}
                onChange={e => setJustificacion(e.target.value)}
                placeholder="¿Por qué tomás esta decisión? (obligatorio)"
                style={{
                  width: "100%",
                  resize: "vertical",
                  fontFamily: "inherit",
                  fontSize: 13,
                  padding: "8px 10px",
                  borderRadius: 6,
                  border: justificacion.trim() ? "1.5px solid var(--borde, #d1d5db)" : "1.5px solid #f59e0b",
                  outline: "none",
                  boxSizing: "border-box",
                }}
              />
              {!justificacion.trim() && (
                <p style={{ fontSize: 11, color: "#f59e0b", margin: "4px 0 0" }}>
                  Este campo es obligatorio para registrar tu decisión en la bitácora.
                </p>
              )}
            </div>

            <div className="modal-actions">
              <button className="btn btn-outline" onClick={() => { setModal(false); setJustificacion(""); }}>Cancelar</button>
              <button
                className={`btn ${preview.tipo === "compra" ? "btn-success" : "btn-danger"}`}
                onClick={confirmar}
                disabled={loading || !justificacion.trim()}
              >
                {loading && <span className="spinner" />}
                {!preview.coherente_perfil ? "Confirmar igualmente" : "Confirmar"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── NOTICIAS ───────────────────────────────────────────────────────────────
function Noticias({ token, onNoLeidasChange }) {
  const [noticias, setNoticias] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expandida, setExpandida] = useState(null);

  useEffect(() => {
    api("GET", "/api/grupos/noticias", null, token)
      .then(ns => {
        setNoticias(ns);
        if (onNoLeidasChange) onNoLeidasChange(ns.filter(n => !n.leida).length);
      })
      .finally(() => setLoading(false));
  }, [token]);

  async function marcarLeida(id) {
    await api("POST", `/api/grupos/noticias/${id}/leer`, null, token);
    setNoticias(n => {
      const updated = n.map(x => x.id === id ? { ...x, leida: true } : x);
      if (onNoLeidasChange) onNoLeidasChange(updated.filter(x => !x.leida).length);
      return updated;
    });
  }

  if (loading) return <div className="page"><div className="card">Cargando noticias...</div></div>;

  const noLeidas = noticias.filter(n => !n.leida);
  const leidas = noticias.filter(n => n.leida);

  return (
    <div className="page">
      {noticias.length === 0 && (
        <div className="alert alert-info">No hay noticias disponibles por el momento.</div>
      )}

      {noLeidas.length > 0 && (
        <>
          <h3 style={{ fontSize: 13, fontWeight: 700, textTransform: "uppercase", color: "var(--gris)", marginBottom: 10 }}>
            No leídas ({noLeidas.length})
          </h3>
          {noLeidas.map(n => (
            <NoticiaCard key={n.id} noticia={n} expanded={expandida === n.id}
              onToggle={() => { setExpandida(expandida === n.id ? null : n.id); marcarLeida(n.id); }}
            />
          ))}
        </>
      )}

      {leidas.length > 0 && (
        <>
          <h3 style={{ fontSize: 13, fontWeight: 700, textTransform: "uppercase", color: "var(--gris)", marginBottom: 10, marginTop: 20 }}>
            Leídas ({leidas.length})
          </h3>
          {leidas.map(n => (
            <NoticiaCard key={n.id} noticia={n} expanded={expandida === n.id}
              onToggle={() => setExpandida(expandida === n.id ? null : n.id)}
            />
          ))}
        </>
      )}
    </div>
  );
}

function NoticiaCard({ noticia, expanded, onToggle }) {
  const tipoColor = noticia.tipo === "fundamental" ? "var(--azul)" : "var(--naranja)";
  const tipoLabel = noticia.tipo === "fundamental" ? "📰 Análisis fundamental" : "📈 Análisis técnico";

  return (
    <div className={`noticia-card ${noticia.tipo}`}
      style={{ opacity: noticia.leida ? 0.75 : 1, cursor: "pointer" }}
      onClick={onToggle}
    >
      <div className="noticia-tipo" style={{ color: tipoColor }}>{tipoLabel}
        {noticia.ticker_relacionado && <span style={{ marginLeft: 8, background: "#f3f4f6", padding: "1px 6px", borderRadius: 4, fontSize: 10 }}>{noticia.ticker_relacionado}</span>}
        {!noticia.leida && <span style={{ marginLeft: 8, background: "var(--azul)", color: "white", padding: "1px 6px", borderRadius: 4, fontSize: 10 }}>NUEVO</span>}
      </div>
      <div className="noticia-titulo">{noticia.titulo}</div>
      {expanded && (
        <div className="noticia-contenido" style={{ marginTop: 8, whiteSpace: "pre-wrap" }}>{noticia.contenido}</div>
      )}
      <div className="noticia-meta">{fmtFecha(noticia.publicado_en)} · {expanded ? "▲ Cerrar" : "▼ Leer más"}</div>
    </div>
  );
}

// ── RANKING ────────────────────────────────────────────────────────────────
function Ranking({ token }) {
  const [ranking, setRanking] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api("GET", "/api/grupos/ranking", null, token)
      .then(setRanking)
      .finally(() => setLoading(false));
    const id = setInterval(() => {
      api("GET", "/api/grupos/ranking", null, token).then(setRanking);
    }, 30000);
    return () => clearInterval(id);
  }, [token]);

  if (loading) return <div className="page"><div className="card">Cargando ranking...</div></div>;

  const medallaColor = (pos) => pos === 1 ? "gold" : pos === 2 ? "silver" : pos === 3 ? "bronze" : "";
  const medalla = (pos) => pos === 1 ? "🥇" : pos === 2 ? "🥈" : pos === 3 ? "🥉" : pos;

  return (
    <div className="page">
      <div className="card">
        <div className="card-title">Ranking de grupos</div>
        {ranking.map(g => (
          <div key={g.grupo} className="ranking-row">
            <div className={`ranking-pos ${medallaColor(g.posicion)}`}>{medalla(g.posicion)}</div>
            <div className="ranking-nombre">{g.grupo}</div>
            <div>
              <div style={{ fontSize: 12, color: "var(--gris)" }}>{fmt(g.capital_total)}</div>
            </div>
            <div className={`ranking-rend ${g.rendimiento_pct >= 0 ? "pos" : "neg"}`}>
              {fmtPct(g.rendimiento_pct)}
            </div>
          </div>
        ))}
        {ranking.length === 0 && <p style={{ color: "var(--gris)", fontSize: 13 }}>Todavía no hay grupos con operaciones.</p>}
      </div>
    </div>
  );
}

// ── PANEL DOCENTE ─────────────────────────────────────────────────────────
function PanelDocente({ token }) {
  const [tab, setTab] = useState("grupos");
  const [grupos, setGrupos] = useState([]);
  const [alumnos, setAlumnos] = useState([]);
  const [noticias, setNoticias] = useState([]);
  const [ranking, setRanking] = useState([]);
  const [loading, setLoading] = useState(false);

  // Formularios
  const [nuevoGrupo, setNuevoGrupo] = useState("");
  const [nuevaNoticia, setNuevaNot] = useState({ titulo: "", contenido: "", tipo: "fundamental", ticker_relacionado: "", publicado_en: "" });
  const [csvFile, setCsvFile] = useState(null);
  const [msg, setMsg] = useState({ type: "", text: "" });

  // Reporte grupo seleccionado
  const [reporteGrupo, setReporteGrupo] = useState(null);
  const [reporteNoticia, setReporteNoticia] = useState(null);

  // Configuración
  const [config, setConfig] = useState({ nombre_experiencia: "", capital_inicial: 1000000, comision: 0.006, activo: false });
  const [savingConfig, setSavingConfig] = useState(false);

  // Bitácoras de decisiones
  const [bitacoras, setBitacoras] = useState([]);
  const [loadingBitacoras, setLoadingBitacoras] = useState(false);
  const [filtroBitacoraGrupo, setFiltroBitacoraGrupo] = useState("");

  // Instrumentos (para tab config)
  const [instrumentos, setInstrumentos] = useState([]);
  const [loadingInstr, setLoadingInstr] = useState(false);
  const [editandoInstr, setEditandoInstr] = useState({}); // id -> {sector, tendencia_esperada}
  const [savingInstr, setSavingInstr] = useState(null);

  // Perfil de grupo
  const [perfilGrupoModal, setPerfilGrupoModal] = useState(null); // { grupo_id, nombre }
  const [perfilForm, setPerfilForm] = useState({
    estilo: "moderado",
    max_pct_por_activo: "", max_pct_por_sector: "",
    min_activos: "", min_sectores: "",
    min_pct_renta_fija: "", max_pct_renta_fija: "",
    min_pct_renta_variable: "", max_pct_renta_variable: "",
    min_pct_liquidez: "", max_pct_liquidez: "",
    respetar_tendencia: false, notas: "",
  });
  const [savingPerfil, setSavingPerfil] = useState(false);

  const cargarGrupos  = useCallback(() => api("GET", "/api/docente/grupos",  null, token).then(setGrupos),   [token]);
  const cargarAlumnos = useCallback(() => api("GET", "/api/docente/alumnos", null, token).then(setAlumnos),  [token]);
  const cargarNoticias = useCallback(() => api("GET", "/api/docente/noticias", null, token).then(setNoticias), [token]);

  useEffect(() => {
    Promise.all([
      api("GET", "/api/docente/grupos", null, token),
      api("GET", "/api/docente/alumnos", null, token),
      api("GET", "/api/docente/noticias", null, token),
      api("GET", "/api/docente/reportes/ranking", null, token),
      api("GET", "/api/docente/configuracion", null, token),
    ]).then(([g, a, n, r, cfg]) => { setGrupos(g); setAlumnos(a); setNoticias(n); setRanking(r); setConfig(cfg); });
  }, [token]);

  // Cargar instrumentos solo al entrar a la tab config
  useEffect(() => {
    if (tab !== "config") return;
    if (instrumentos.length > 0) return; // ya cargados
    setLoadingInstr(true);
    api("GET", "/api/docente/instrumentos", null, token)
      .then(data => { setInstrumentos(data); })
      .catch(() => {})
      .finally(() => setLoadingInstr(false));
  }, [tab, token]);

  // Cargar bitácoras solo al entrar a la tab bitacoras
  useEffect(() => {
    if (tab !== "bitacoras") return;
    setLoadingBitacoras(true);
    api("GET", "/api/docente/reportes/bitacoras", null, token)
      .then(data => { setBitacoras(data); })
      .catch(() => {})
      .finally(() => setLoadingBitacoras(false));
  }, [tab, token]);

  async function abrirPerfilModal(grupo) {
    setPerfilGrupoModal({ grupo_id: grupo.id, nombre: grupo.nombre });
    // Cargar perfil existente si lo hay
    try {
      const p = await api("GET", `/api/docente/grupos/${grupo.id}/perfil`, null, token);
      if (p.asignado) {
        setPerfilForm({
          estilo: p.estilo || "moderado",
          max_pct_por_activo: p.max_pct_por_activo != null ? (p.max_pct_por_activo * 100).toFixed(0) : "",
          max_pct_por_sector: p.max_pct_por_sector != null ? (p.max_pct_por_sector * 100).toFixed(0) : "",
          min_activos: p.min_activos ?? "",
          min_sectores: p.min_sectores ?? "",
          min_pct_renta_fija: p.min_pct_renta_fija != null ? (p.min_pct_renta_fija * 100).toFixed(0) : "",
          max_pct_renta_fija: p.max_pct_renta_fija != null ? (p.max_pct_renta_fija * 100).toFixed(0) : "",
          min_pct_renta_variable: p.min_pct_renta_variable != null ? (p.min_pct_renta_variable * 100).toFixed(0) : "",
          max_pct_renta_variable: p.max_pct_renta_variable != null ? (p.max_pct_renta_variable * 100).toFixed(0) : "",
          min_pct_liquidez: p.min_pct_liquidez != null ? (p.min_pct_liquidez * 100).toFixed(0) : "",
          max_pct_liquidez: p.max_pct_liquidez != null ? (p.max_pct_liquidez * 100).toFixed(0) : "",
          respetar_tendencia: p.respetar_tendencia || false,
          notas: p.notas || "",
        });
      } else {
        setPerfilForm({ estilo: "moderado", max_pct_por_activo: "", max_pct_por_sector: "", min_activos: "", min_sectores: "", min_pct_renta_fija: "", max_pct_renta_fija: "", min_pct_renta_variable: "", max_pct_renta_variable: "", min_pct_liquidez: "", max_pct_liquidez: "", respetar_tendencia: false, notas: "" });
      }
    } catch (e) {
      setPerfilForm({ estilo: "moderado", max_pct_por_activo: "", max_pct_por_sector: "", min_activos: "", min_sectores: "", min_pct_renta_fija: "", max_pct_renta_fija: "", min_pct_renta_variable: "", max_pct_renta_variable: "", min_pct_liquidez: "", max_pct_liquidez: "", respetar_tendencia: false, notas: "" });
    }
  }

  function pctToDecimal(val) {
    const n = parseFloat(val);
    return isNaN(n) ? null : n / 100;
  }

  async function guardarPerfil() {
    if (!perfilGrupoModal) return;
    setSavingPerfil(true);
    try {
      await api("PUT", `/api/docente/grupos/${perfilGrupoModal.grupo_id}/perfil`, {
        estilo: perfilForm.estilo,
        max_pct_por_activo: pctToDecimal(perfilForm.max_pct_por_activo),
        max_pct_por_sector: pctToDecimal(perfilForm.max_pct_por_sector),
        min_activos: perfilForm.min_activos !== "" ? parseInt(perfilForm.min_activos) : null,
        min_sectores: perfilForm.min_sectores !== "" ? parseInt(perfilForm.min_sectores) : null,
        min_pct_renta_fija: pctToDecimal(perfilForm.min_pct_renta_fija),
        max_pct_renta_fija: pctToDecimal(perfilForm.max_pct_renta_fija),
        min_pct_renta_variable: pctToDecimal(perfilForm.min_pct_renta_variable),
        max_pct_renta_variable: pctToDecimal(perfilForm.max_pct_renta_variable),
        min_pct_liquidez: pctToDecimal(perfilForm.min_pct_liquidez),
        max_pct_liquidez: pctToDecimal(perfilForm.max_pct_liquidez),
        respetar_tendencia: perfilForm.respetar_tendencia,
        notas: perfilForm.notas || null,
      }, token);
      flash("success", `Perfil asignado a ${perfilGrupoModal.nombre}`);
      // Recargar grupos para reflejar el perfil
      const g = await api("GET", "/api/docente/grupos", null, token);
      setGrupos(g);
      setPerfilGrupoModal(null);
    } catch (e) {
      flash("error", e.message);
    } finally {
      setSavingPerfil(false);
    }
  }

  async function guardarTendenciaInstr(id) {
    const cambios = editandoInstr[id];
    if (!cambios) return;
    setSavingInstr(id);
    try {
      const updated = await api("PUT", `/api/docente/instrumentos/${id}`, cambios, token);
      setInstrumentos(prev => prev.map(i => i.id === id ? { ...i, ...updated } : i));
      setEditandoInstr(prev => { const n = { ...prev }; delete n[id]; return n; });
      flash("success", "Instrumento actualizado.");
    } catch (e) {
      flash("error", e.message);
    } finally {
      setSavingInstr(null);
    }
  }

  function flash(type, text) { setMsg({ type, text }); setTimeout(() => setMsg({ type: "", text: "" }), 4000); }

  async function crearGrupo() {
    if (!nuevoGrupo.trim()) return;
    try {
      const g = await api("POST", "/api/docente/grupos", { nombre: nuevoGrupo }, token);
      setGrupos(prev => [...prev, g]);
      setNuevoGrupo("");
      flash("success", `Grupo "${g.nombre}" creado. Código: ${g.codigo_acceso}`);
    } catch (e) { flash("error", e.message); }
  }

  async function subirCSV() {
    if (!csvFile) return;
    const form = new FormData();
    form.append("file", csvFile);
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/api/docente/alumnos/csv`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: form,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);
      const errs = data.errores || [];
      flash("success", `${data.creados} alumnos cargados.${errs.length ? " Errores: " + errs.join("; ") : ""}`);
      const al = await api("GET", "/api/docente/alumnos", null, token);
      setAlumnos(al);
    } catch (e) { flash("error", e.message); }
    finally { setLoading(false); setCsvFile(null); }
  }

  async function publicarNoticia() {
    const { titulo, contenido, tipo, ticker_relacionado, publicado_en } = nuevaNoticia;
    if (!titulo || !contenido || !publicado_en) {
      flash("error", "Completá título, contenido y fecha de publicación.");
      return;
    }
    try {
      await api("POST", "/api/docente/noticias", {
        titulo, contenido, tipo,
        ticker_relacionado: ticker_relacionado || null,
        publicado_en: new Date(publicado_en).toISOString(),
      }, token);
      flash("success", "Noticia publicada.");
      setNuevaNot({ titulo: "", contenido: "", tipo: "fundamental", ticker_relacionado: "", publicado_en: "" });
      const n = await api("GET", "/api/docente/noticias", null, token);
      setNoticias(n);
    } catch (e) { flash("error", e.message); }
  }

  async function asignarAlumno(alumnoId, grupoId) {
    try {
      if (grupoId === "") {
        flash("error", "Seleccioná un grupo válido.");
        return;
      }
      await api("POST", `/api/docente/grupos/${grupoId}/alumnos`, { alumno_ids: [alumnoId] }, token);
      const al = await api("GET", "/api/docente/alumnos", null, token);
      setAlumnos(al);
      flash("success", "Alumno asignado al grupo.");
    } catch (e) { flash("error", e.message); }
  }

  async function verReporteGrupo(id) {
    const r = await api("GET", `/api/docente/reportes/grupo/${id}`, null, token);
    setReporteGrupo(r);
  }

  async function verReporteNoticia(id) {
    const r = await api("GET", `/api/docente/reportes/noticias/${id}`, null, token);
    setReporteNoticia(r);
  }

  async function guardarConfig(patch) {
    setSavingConfig(true);
    try {
      await api("PUT", "/api/docente/configuracion", patch, token);
      setConfig(c => ({ ...c, ...patch }));
      flash("success", patch.activo !== undefined
        ? (patch.activo ? "✅ Simulador activado. Historial generado para todos los activos." : "⏸ Simulador desactivado.")
        : "Configuración guardada.");
    } catch (e) { flash("error", e.message); }
    finally { setSavingConfig(false); }
  }

  async function regenerarHistorial() {
    setSavingConfig(true);
    try {
      await api("POST", "/api/docente/configuracion/regenerar-historial", null, token);
      flash("success", "✅ Historial regenerado. Las variaciones de sesión se reiniciaron.");
    } catch (e) { flash("error", e.message); }
    finally { setSavingConfig(false); }
  }

    <div className="page">

      <div className="nav-tabs" style={{ marginBottom: 20, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>

          { id: "ranking",   label: "🏆 Ranking" },
          { id: "bitacoras", label: "📓 Bitácoras" },

          </button>

        {/* Modal asignación perfil de grupo */}
        {perfilGrupoModal && (
          <div className="modal-overlay" onClick={() => setPerfilGrupoModal(null)}>

                  <option value="libre">Libre (sin restricciones)</option>

              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>

                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label className="form-label">Máx. % por sector</label>

                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label className="form-label">Mín. sectores</label>
                  <input type="number" min={1} placeholder="Ej: 2"

                  <input type="number" min={0} max={100} placeholder="Ej: 10"

                <div className="form-group" style={{ marginBottom: 0 }}>

                </div>

                    value={perfilForm.min_pct_liquidez}

                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label className="form-label">Máximo %</label>
                  <input type="number" min={0} max={100} placeholder="Ej: 30"

              <div className="modal-actions">
                <button className="btn btn-outline" onClick={() => setPerfilGrupoModal(null)}>Cancelar</button>

                  {savingPerfil ? "Guardando..." : "💾 Guardar perfil"}
                </button>
              </div>
            </div>
          </div>
        )}
        {/* indicador estado simulador */}
        <span style={{
          marginLeft: "auto", fontSize: 12, fontWeight: 600,
          color: config.activo ? "var(--verde)" : "var(--gris)",

          <span style={{
            width: 8, height: 8, borderRadius: "50%",
            background: config.activo ? "var(--verde)" : "var(--gris)",
            display: "inline-block",
            boxShadow: config.activo ? "0 0 0 3px rgba(22,163,74,.25)" : "none",
          }} />
          {config.activo ? "Simulador activo" : "Simulador inactivo"}
        </span>
      </div>

      {tab === "grupos" && (
        <>
          <div className="panel-section">
            <div className="panel-section-title">Crear grupo</div>
            <div style={{ display: "flex", gap: 8 }}>
              <input value={nuevoGrupo} onChange={e => setNuevoGrupo(e.target.value)}

              <button className="btn btn-primary" onClick={crearGrupo}>Crear</button>

          <div className="panel-section">

                  await api("POST", "/api/docente/grupos/reset", null, token);
                  cargarGrupos();
                }}>🗑 Resetear grupos</button>
            </div>
            {grupos.map(g => (
              <div key={g.id} className="card" style={{ padding: "14px 18px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <b>{g.nombre}</b>
                    <span style={{ marginLeft: 10, fontFamily: "monospace", background: "#f3f4f6", padding: "2px 8px", borderRadius: 6, fontSize: 13, fontWeight: 700 }}>{g.codigo_acceso}</span>
                    {g.perfil_riesgo && <span className={`badge badge-${g.perfil_riesgo}`} style={{ marginLeft: 8 }}>{g.perfil_riesgo}</span>}
                    {g.encuesta_completada && (
                      <span style={{ marginLeft: 6, fontSize: 11, color: "var(--verde)", fontWeight: 600 }}>✓ perfil asignado</span>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button className="btn btn-outline btn-sm" style={{ color: "#6366f1", borderColor: "#6366f1" }} onClick={() => abrirPerfilModal(g)}>🎯 Perfil</button>
                    <button className="btn btn-outline btn-sm" onClick={() => verReporteGrupo(g.id)}>Ver reporte</button>
                    <button className="btn btn-outline btn-sm" style={{ color: "var(--rojo)", borderColor: "var(--rojo)" }}
                      title="Eliminar grupo"
                      onClick={async () => {
                        if (!confirm(`¿Eliminar "${g.nombre}"? Se borrarán sus operaciones, posiciones y perfil.`)) return;
                        await api("DELETE", `/api/docente/grupos/${g.id}`, null, token);
                        cargarGrupos();
                      }}>🗑</button>
                  </div>
                </div>
                <div style={{ fontSize: 12, color: "var(--gris)", marginTop: 6 }}>
                  Capital: {fmt(g.capital_total ?? 0)} · {g.num_operaciones} operaciones · {(g.alumnos || []).length} alumnos

              </div>
            ))}
          </div>

          {/* Modal reporte grupo */}
          {reporteGrupo && (

                <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>

                    ["Rendimiento", fmtPct(reporteGrupo.rendimiento_pct)],

                    <div key={l} className="kpi" style={{ flex: "1 1 140px", padding: "10px 14px" }}>

                      <div className="kpi-value" style={{ fontSize: 15 }}>{v}</div>

                  ))}

                    {reporteGrupo.operaciones.map((o, i) => (
                      <tr key={i}>

                  <button className="btn btn-outline" onClick={() => setReporteGrupo(null)}>Cerrar</button>

          </div>
          <div className="panel-section">

                    <td>
                      <button className="btn btn-outline btn-sm" style={{ color: "var(--rojo)", borderColor: "var(--rojo)", padding: "2px 8px" }}

                        onClick={async () => {
                          if (!confirm(`¿Eliminar a ${a.nombre} ${a.apellido}?`)) return;

              <label className="form-label">Ticker relacionado (opcional)</label>
